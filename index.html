<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apex Computers — Custom PCs, Parts &amp; Tech Service</title>
<link rel="stylesheet" href="staff-workspace.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://www.paypal.com/sdk/js?client-id=BAA8sZzIVGn0mtN-TUfq2F4ptHsbab94ATX1H59c6vi4LiFy1J1gVQr0P12P4whcPjauMAHHT6WP0BufS0&currency=USD&intent=capture&components=buttons"></script>
<style>
:root{
  --board:#0C3B2E; --board-2:#082A20; --gold:#C9A227; --gold-2:#8E7118;
  --silk:#F3F6F2; --paper:#EAEFEA; --panel:#FFFFFF; --ink:#14201B;
  --ink-2:#4A5952; --line:#C9D3CC; --alert:#B23B26; --ok:#1E6E4F;
  --radius:3px; --wrap:1120px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F1614; --panel:#16201C; --ink:#E8EEE9; --ink-2:#9FB0A7;
    --line:#2C3A34; --silk:#F3F6F2; --gold:#D8B23C;
  }
}
:root[data-theme="dark"]{
  --paper:#0F1614; --panel:#16201C; --ink:#E8EEE9; --ink-2:#9FB0A7;
  --line:#2C3A34; --gold:#D8B23C;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:16px; line-height:1.55; -webkit-text-size-adjust:100%;
}
h1,h2,h3,h4{font-family:Archivo,"IBM Plex Sans",sans-serif;font-weight:800;letter-spacing:-.02em;margin:0 0 .4em;line-height:1.08}
h1{font-size:clamp(2rem,5.4vw,3.4rem)}
h2{font-size:clamp(1.5rem,3.2vw,2.1rem)}
h3{font-size:1.15rem;font-weight:600}
p{margin:0 0 1em;max-width:70ch}
a{color:inherit}
img{max-width:100%;display:block}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 20px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* ---- top bar ---- */
header.site{background:var(--board);color:var(--silk);border-bottom:2px solid var(--gold)}
.bar{display:flex;align-items:center;gap:18px;min-height:64px;flex-wrap:wrap;padding:8px 20px;max-width:var(--wrap);margin:0 auto}
.brand{font-family:Archivo;font-weight:800;font-size:1.15rem;letter-spacing:-.02em;text-decoration:none;display:flex;align-items:center;gap:10px}
.brand .pad{width:14px;height:14px;background:var(--gold);border-radius:2px;box-shadow:0 0 0 3px rgba(201,162,39,.25)}
nav.main{display:flex;gap:2px;flex-wrap:wrap;margin-left:auto;align-items:center}
nav.main a{padding:8px 12px;text-decoration:none;font-size:.94rem;font-weight:500;border-radius:var(--radius);opacity:.86}
nav.main a:hover{opacity:1;background:rgba(255,255,255,.09)}
nav.main a.on{opacity:1;background:var(--gold);color:#241d00;font-weight:600}
.cartbtn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);color:var(--silk);padding:8px 13px;border-radius:var(--radius);cursor:pointer;font-weight:600;font-size:.9rem}
.adminstrip{background:var(--gold);color:#241d00;font-weight:600;font-size:.86rem}
.adminstrip .wrap{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding-top:7px;padding-bottom:7px}
.adminstrip button{background:#241d00;color:#fff;border:0;padding:5px 11px;border-radius:var(--radius);cursor:pointer;font-size:.82rem;font-weight:600}

/* ---- hero ---- */
.hero{background:var(--board-2);color:var(--silk);
  background-image:linear-gradient(90deg,rgba(201,162,39,.16) 1px,transparent 1px),linear-gradient(rgba(201,162,39,.16) 1px,transparent 1px);
  background-size:52px 52px;}
.hero .wrap{padding:64px 20px 56px;display:grid;grid-template-columns:1.35fr .9fr;gap:40px;align-items:end}
.hero h1{color:var(--silk);max-width:14ch}
.hero p{color:#C7D6CE;font-size:1.06rem;max-width:44ch}
.specsheet{border:1px solid rgba(201,162,39,.5);background:rgba(0,0,0,.25)}
.specsheet div{display:flex;justify-content:space-between;gap:16px;padding:10px 14px;border-bottom:1px dashed rgba(201,162,39,.3);font-size:.92rem}
.specsheet div:last-child{border-bottom:0}
.specsheet span:first-child{color:#A9BDB2}
.specsheet span:last-child{font-weight:600;color:var(--gold)}

/* ---- layout bits ---- */
main{min-height:58vh;padding:44px 0 72px}
.pagehead{border-bottom:2px solid var(--board);padding-bottom:14px;margin-bottom:28px;display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}
.pagehead p{margin:6px 0 0;color:var(--ink-2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.shelf{margin-bottom:34px}
.shelf-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}
.shelf-head h3{margin:0;font-size:1.3rem}
.shelf-arrows{display:flex;gap:6px}
.shelf-arrows button{width:36px;height:36px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:var(--radius);cursor:pointer;font-size:1.1rem;line-height:1}
.shelf-row{display:flex;gap:14px;overflow-x:auto;overscroll-behavior-x:contain;scroll-snap-type:x proximity;padding:2px 2px 14px;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.shelf-row>.card{flex:0 0 245px;scroll-snap-align:start;border:1px solid var(--line)}
.shelf-row.feat>.card{flex-basis:340px;border-color:var(--gold)}
.clamp3{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.badge-feat{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 8px;background:var(--gold);color:#241d00;border-radius:99px}
.step>details>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.step>details>summary::-webkit-details-marker{display:none}
.step>details[open]>summary{margin-bottom:12px}
.step>details>summary h3{margin:0;display:flex;align-items:center;gap:10px}
.card{background:var(--panel);padding:18px;display:flex;flex-direction:column;gap:8px}
.card .thumb{aspect-ratio:4/3;background:var(--paper);border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;color:var(--ink-2);font-size:.8rem;overflow:hidden}
.card .thumb img{width:100%;height:100%;object-fit:cover}
.price{font-family:Archivo;font-weight:800;font-size:1.3rem;color:var(--board)}
:root[data-theme="dark"] .price,:root:not([data-theme="light"]) .price{color:var(--gold)}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .price{color:var(--board)}}
.tag{display:inline-block;font-size:.72rem;font-weight:600;padding:2px 7px;border:1px solid var(--gold);color:var(--gold-2);border-radius:99px}
.muted{color:var(--ink-2)}
.empty{border:1px dashed var(--line);padding:44px 24px;text-align:center;color:var(--ink-2);background:var(--panel)}
.empty strong{display:block;color:var(--ink);font-family:Archivo;font-size:1.2rem;margin-bottom:6px}

.btn{display:inline-block;background:var(--board);color:#fff;border:0;padding:11px 18px;border-radius:var(--radius);font-weight:600;cursor:pointer;text-decoration:none;font-size:.95rem}
.btn:hover{background:var(--board-2)}
.btn.gold{background:var(--gold);color:#241d00}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--alert)}
.btn.sm{padding:6px 11px;font-size:.84rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

label{display:block;font-size:.85rem;font-weight:600;margin-bottom:4px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel)}
textarea{min-height:90px;resize:vertical}
.field{margin-bottom:14px}
.fields2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
form.panel,.panel{background:var(--panel);border:1px solid var(--line);padding:22px}

table{width:100%;border-collapse:collapse;background:var(--panel)}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);font-size:.93rem;vertical-align:top}
th{font-family:Archivo;font-size:.8rem;color:var(--ink-2)}

.steps{display:grid;gap:1px;background:var(--line);border:1px solid var(--line)}
.step{background:var(--panel);padding:20px}
.step h3{display:flex;align-items:center;gap:10px}
.step h3 .n{width:26px;height:26px;background:var(--board);color:var(--gold);display:grid;place-items:center;font-size:.85rem;border-radius:2px;flex:none}
.pick{display:flex;justify-content:space-between;gap:14px;align-items:center;border:1px solid var(--line);padding:12px;margin-bottom:8px;background:var(--panel)}
.pick.sel{border-color:var(--gold);box-shadow:inset 3px 0 0 var(--gold)}
.pick small{color:var(--ink-2);display:block}
.fit{font-size:.74rem;font-weight:600;color:var(--ok)}
.nofit{font-size:.74rem;font-weight:600;color:var(--alert)}

.summary{position:sticky;top:16px;max-height:calc(100vh - 32px);overflow-y:auto}
.blist{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
.btile{position:relative;border:1px solid var(--line);background:var(--paper);border-radius:var(--radius);padding:6px;cursor:pointer;display:flex;flex-direction:column;gap:3px;min-width:0}
.btile .cat{font-size:.66rem;font-weight:700;color:var(--ink-2);text-transform:uppercase;letter-spacing:.04em;padding-right:22px}
.btile .pic{aspect-ratio:1/1;background:var(--panel);border-radius:3px;display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:.74rem;color:var(--ink-2);text-align:center;padding:2px}
.btile .pic img{width:100%;height:100%;object-fit:cover;display:block}
.btile .nm{font-size:.74rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btile .pr{font-family:Archivo,sans-serif;font-weight:800;font-size:.9rem}
.btile .x{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:99px;border:0;background:var(--alert);color:#fff;cursor:pointer;font-size:.85rem;line-height:1;padding:0}
.btile.empty{border-style:dashed;background:transparent}
.btile.empty .pic{border:1px dashed var(--line);background:transparent;font-weight:600}
.lineitem{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:.93rem}
.total{display:flex;justify-content:space-between;font-family:Archivo;font-weight:800;font-size:1.25rem;padding-top:12px}

.split{display:grid;grid-template-columns:1.6fr .9fr;gap:28px;align-items:start}
.notice{border-left:4px solid var(--gold);background:var(--panel);padding:14px 16px;font-size:.9rem;margin-bottom:18px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--board);color:#fff;padding:12px 20px;border-radius:var(--radius);z-index:99;box-shadow:0 6px 24px rgba(0,0,0,.3)}
dialog{border:1px solid var(--line);border-radius:var(--radius);padding:0;max-width:420px;width:92%;background:var(--panel);color:var(--ink)}
dialog::backdrop{background:rgba(8,42,32,.6)}
.dlg{padding:24px}
footer.site{background:var(--board);color:#B9CCC2;padding:34px 0;font-size:.9rem}
footer.site a{color:var(--gold)}
.scroll{overflow-x:auto}
@media (max-width:820px){
  .hero .wrap{grid-template-columns:1fr;padding:44px 20px}
  .split{grid-template-columns:1fr}
  .fields2{grid-template-columns:1fr}
  .summary{position:static;max-height:none;overflow:visible}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---- refined card styling ---- */
:root{--radius:10px;--wrap:1160px}
.grid{gap:14px;background:transparent;border:0}
.grid .card{border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 3px 14px rgba(0,0,0,.045);transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}
.grid .card:hover{transform:translateY(-3px);border-color:var(--gold);box-shadow:0 10px 24px rgba(0,0,0,.10)}
.card .thumb{border-radius:7px;border-style:solid}
.panel,.step,.notice{border-radius:var(--radius)}
.shelf-row>.card{border-radius:var(--radius);overflow:hidden}
.btn,.cartbtn,nav.main a{transition:background-color .16s ease,transform .16s ease}
.btn:hover{transform:translateY(-1px)}
@media(prefers-reduced-motion:reduce){.grid .card,.btn,.cartbtn,nav.main a{transition:none}.grid .card:hover,.btn:hover{transform:none}}


/* ---------- Apex shop page polish ---------- */
.products-page{padding-bottom:44px}
.products-hero{position:relative;overflow:hidden;background:linear-gradient(115deg,#082a20 0%,#0c3b2e 58%,#14513d 100%);color:#f3f6f2;border-bottom:3px solid var(--gold)}
.products-hero:after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(201,162,39,.09) 1px,transparent 1px),linear-gradient(90deg,rgba(201,162,39,.09) 1px,transparent 1px);background-size:42px 42px;mask-image:linear-gradient(90deg,#000,transparent 90%);pointer-events:none}
.products-hero-inner{min-height:290px;display:flex;align-items:center;justify-content:space-between;gap:30px;padding-top:42px;padding-bottom:42px;position:relative;z-index:1}
.products-hero-copy{max-width:690px}
.products-eyebrow,.products-kicker{display:inline-block;font-family:Archivo,sans-serif;font-size:.72rem;font-weight:700;letter-spacing:.16em;color:var(--gold);margin-bottom:13px}
.products-hero h1{font-size:clamp(2.2rem,5vw,3.65rem);line-height:1.02;color:#fff;margin:0 0 16px;letter-spacing:-.045em}
.products-hero h1 span{color:#d8b94e}
.products-hero-copy>p{font-size:1.04rem;color:#c7d6ce;max-width:52ch;margin:0}
.products-hero-meta{display:flex;align-items:center;gap:14px;margin-top:23px;color:#c7d6ce;font-size:.83rem}
.products-hero-meta b{color:#fff;font-family:Archivo,sans-serif;font-size:1.05rem}
.products-hero-meta i{width:4px;height:4px;border-radius:50%;background:var(--gold)}
.products-hero-art{width:210px;height:210px;flex:0 0 210px;position:relative;display:grid;place-items:center;margin-right:5%}
.art-ring{position:absolute;border:1px solid rgba(216,178,60,.55);border-radius:50%;transform:rotate(-24deg)}
.ring-one{width:190px;height:190px}.ring-two{width:148px;height:148px;border-style:dashed;opacity:.8}
.art-chip{width:104px;height:104px;background:linear-gradient(145deg,#d8b23c,#92731a);color:#1d2419;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 12px 35px rgba(0,0,0,.3);clip-path:polygon(12% 0,88% 0,100% 12%,100% 88%,88% 100%,12% 100%,0 88%,0 12%)}
.art-chip span{font-size:.56rem;font-weight:800;letter-spacing:.2em}.art-chip b{font-family:Archivo,sans-serif;font-size:2.1rem;line-height:1}.art-chip small{font-size:.48rem;font-weight:800;letter-spacing:.12em}
.products-content{padding-top:38px}
.products-heading{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:22px;flex-wrap:wrap}
.products-heading .products-kicker{margin-bottom:6px;color:var(--ink-2)}
.products-heading h2{margin:0 0 6px}.products-heading p{margin:0;color:var(--ink-2);font-size:.93rem}
.products-filters{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin-bottom:30px;box-shadow:0 5px 20px rgba(0,0,0,.035)}
.products-filters .fields2{gap:0 14px}.products-filters .field{margin-bottom:12px}.products-filters .field:last-of-type{margin-bottom:0}
.products-filters label{font-size:.76rem;letter-spacing:.035em;color:var(--ink-2);text-transform:uppercase}
.products-filters input,.products-filters select{border-radius:7px;min-height:43px}
.products-page .shelf{margin-bottom:36px}
.products-page .shelf-head{border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:14px}
.products-page .shelf-head h3{font-size:1.22rem;color:var(--ink)}
.products-page .shelf-head h3 .muted{font-size:.75rem!important;background:var(--paper);padding:3px 8px;border-radius:99px}
.products-page .shelf-arrows button{border-radius:7px;transition:all .16s ease}
.products-page .shelf-arrows button:hover{background:var(--board);color:#fff;border-color:var(--board)}
.products-page .shelf-row{gap:16px;padding:3px 3px 16px}
.products-page .shelf-row>.product-card{flex-basis:250px;min-height:100%;border-radius:11px;overflow:hidden;padding:0;gap:0;box-shadow:0 3px 14px rgba(0,0,0,.045);transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}
.products-page .shelf-row>.product-card:hover{transform:translateY(-4px);border-color:var(--gold);box-shadow:0 12px 26px rgba(0,0,0,.11)}
.products-page .product-thumb{aspect-ratio:5/4;border:0;border-bottom:1px solid var(--line);border-radius:0;background:var(--paper);padding:12px}
.products-page .product-thumb img{object-fit:contain;mix-blend-mode:multiply}
:root[data-theme="dark"] .products-page .product-thumb img,:root:not([data-theme="light"]) .products-page .product-thumb img{mix-blend-mode:normal}
.products-page .product-card>.row,.products-page .product-card>h3,.products-page .product-card>p,.products-page .product-card>.price,.products-page .product-card>.row:last-of-type{margin-left:15px;margin-right:15px}
.products-page .product-card>.row:first-of-type{margin-top:14px;min-height:22px}
.products-page .product-card>h3{font-size:.98rem;line-height:1.3;min-height:2.55em;margin-top:7px;margin-bottom:0}
.products-page .product-card>p{font-size:.82rem!important;line-height:1.5;margin-top:8px!important}
.products-page .product-card>.price{font-size:1.35rem;margin-top:13px;margin-bottom:13px;color:var(--board)}
:root[data-theme="dark"] .products-page .product-card>.price,:root:not([data-theme="light"]) .products-page .product-card>.price{color:var(--gold)}
.products-page .product-card>.row:nth-last-child(2){margin-bottom:15px;gap:7px}
.products-page .product-card .btn{flex:1;min-width:0;text-align:center;padding:8px 10px;border-radius:7px}
.products-page .product-card>.row:last-child{margin-top:0;margin-bottom:14px;flex-wrap:wrap}
.products-page .badge-feat{border-radius:99px}
.products-page .tag{border-radius:99px;font-size:.67rem;padding:3px 8px}
@media(max-width:700px){.products-hero-inner{min-height:250px;padding-top:34px;padding-bottom:34px}.products-hero-art{width:120px;height:120px;flex-basis:120px;margin-right:0;opacity:.72}.ring-one{width:118px;height:118px}.ring-two{width:92px;height:92px}.art-chip{width:70px;height:70px}.art-chip b{font-size:1.5rem}.art-chip span{font-size:.45rem}.art-chip small{font-size:.38rem}.products-hero h1{font-size:clamp(2rem,8vw,3rem)}.products-content{padding-top:28px}.products-heading{align-items:flex-start}.products-page .shelf-row>.product-card{flex-basis:225px}}
@media(max-width:460px){.products-hero-art{display:none}.products-hero-inner{min-height:0}.products-filters{padding:15px}.products-page .shelf-row>.product-card{flex-basis:210px}}

/* ---------- Homepage refresh: consistent color + responsive layout ---------- */
:root{color-scheme:light}
.home-hero{position:relative;overflow:hidden;margin:-44px 0 0;background:radial-gradient(ellipse at 78% 35%,rgba(32,119,83,.42),transparent 36%),linear-gradient(120deg,#071f19 0%,#0b3528 54%,#104a35 100%);color:#f3f7f3;border-bottom:1px solid rgba(216,178,60,.48)}
.home-hero-grid{position:absolute;inset:0;pointer-events:none;opacity:.24;background-image:linear-gradient(rgba(216,178,60,.18) 1px,transparent 1px),linear-gradient(90deg,rgba(216,178,60,.18) 1px,transparent 1px);background-size:48px 48px;mask-image:linear-gradient(110deg,#000,transparent 90%)}
.home-hero-inner{position:relative;z-index:1;min-height:430px;padding-top:64px;padding-bottom:48px;display:grid;grid-template-columns:1.15fr .85fr;align-items:center;gap:28px}
.home-hero-copy{max-width:650px}
.home-kicker{display:inline-flex;align-items:center;gap:9px;color:#d9b94f;font-family:Archivo,sans-serif;font-size:.7rem;font-weight:800;letter-spacing:.16em;margin-bottom:14px}
.home-live-dot,.home-float-tag i{width:7px;height:7px;border-radius:50%;background:#7be0a7;box-shadow:0 0 12px rgba(123,224,167,.85)}
.home-hero h1{font-size:clamp(3rem,6vw,5.25rem);line-height:.98;letter-spacing:-.06em;color:#fff;margin:0 0 20px;max-width:12ch}
.home-hero h1 span{color:#d8b23c}
.home-hero-copy>p{color:#c5d8ce;font-size:1.04rem;max-width:48ch;line-height:1.7}
.home-hero-actions{margin-top:24px;gap:12px}
.home-hero-actions .btn{padding:12px 19px;border-radius:8px}
.home-outline-btn{background:rgba(255,255,255,.06);color:#f3f7f3;border:1px solid rgba(255,255,255,.32)}
.home-outline-btn:hover{background:rgba(255,255,255,.13)}
.home-trust-row{display:flex;flex-wrap:wrap;gap:10px 20px;margin-top:30px;color:#b8cec2;font-size:.76rem}
.home-hero-visual{height:310px;position:relative;display:grid;place-items:center;isolation:isolate}

.home-stats strong{font-family:Archivo,sans-serif;font-size:1.15rem;color:#fff}.home-stats span{font-size:.75rem;color:#b9cec3}
.home-content{padding-top:46px;padding-bottom:20px}
.home-showcase{margin-bottom:48px}

.home-section-head .home-kicker{margin-bottom:7px;color:var(--gold-2)}
.home-section-head h2{margin:0 0 7px;font-size:clamp(1.5rem,3vw,2.1rem)}
.home-section-head p{margin:0;color:var(--ink-2);font-size:.9rem}
.home-text-link{white-space:nowrap;text-decoration:none;font-weight:700;font-size:.88rem;color:var(--board);padding-bottom:5px}

.home-marquee-track{display:flex;align-items:stretch;gap:16px;width:max-content;animation:homeMarquee 52s linear infinite}
.home-marquee:hover .home-marquee-track,.home-marquee:focus-within .home-marquee-track,.home-marquee:focus .home-marquee-track{animation-play-state:paused}
.home-marquee .product-card{flex:0 0 250px;width:250px;border:1px solid var(--line);border-radius:12px;overflow:hidden;padding:0;gap:0;background:var(--panel);box-shadow:0 4px 16px rgba(0,0,0,.06)}

.home-marquee .product-card>.row,.home-marquee .product-card>h3,.home-marquee .product-card>p,.home-marquee .product-card>.price{margin-left:14px;margin-right:14px}

.home-marquee .product-card>h3{font-size:.94rem;line-height:1.3;min-height:2.5em;margin-top:7px;margin-bottom:0}

.home-marquee .product-card>.price{font-size:1.25rem;margin-top:11px;margin-bottom:12px;color:var(--board)}
.home-marquee .product-card>.row:nth-last-child(2){margin:0 14px 14px;gap:7px}
.home-marquee .product-card .btn{flex:1;text-align:center;min-width:0;padding:8px 7px;border-radius:7px}
.home-marquee-note{text-align:right;color:var(--ink-2);font-size:.72rem;margin:0 4px}
.home-journey{margin:16px 0 48px}
.home-journey-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:20px}
.home-journey-card{position:relative;display:flex;flex-direction:column;min-height:260px;padding:22px;text-decoration:none;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);overflow:hidden;transition:transform .2s ease,border-color .2s ease,box-shadow .2s ease}
.home-journey-card:after{content:"";position:absolute;width:170px;height:170px;border:1px solid rgba(201,162,39,.18);border-radius:50%;right:-75px;top:-75px;box-shadow:0 0 0 22px rgba(201,162,39,.035),0 0 0 44px rgba(201,162,39,.025)}
.home-journey-card:hover{transform:translateY(-4px);border-color:var(--gold);box-shadow:0 12px 28px rgba(0,0,0,.09)}
.journey-icon{width:42px;height:42px;display:grid;place-items:center;background:#e8efe9;color:var(--board);border-radius:10px;font-size:1.35rem;margin-bottom:23px}
.journey-number{font-family:Archivo,sans-serif;font-size:.67rem;font-weight:800;letter-spacing:.14em;color:var(--gold-2);margin-bottom:8px}
.home-journey-card h3{font-size:1.15rem;margin:0 0 9px}
.home-journey-card p{font-size:.86rem;color:var(--ink-2);line-height:1.6;margin:0 0 18px}
.home-journey-card>b{margin-top:auto;color:var(--board);font-size:.84rem}
.home-journey-card>b span{color:var(--gold-2);margin-left:4px}
.home-build-strip{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:27px 30px;border-radius:13px;background:linear-gradient(110deg,#0a3024,#12513a);color:#f3f7f3;margin-bottom:24px}
.home-build-strip .home-kicker{margin-bottom:8px}
.home-build-strip h2{margin:0 0 7px;color:#fff;font-size:1.65rem}
.home-build-strip p{margin:0;color:#c4d7cc;font-size:.9rem}
.home-build-strip .btn{white-space:nowrap;border-radius:8px}
@keyframes homeMarquee{from{transform:translateX(0)}to{transform:translateX(calc(-50% - 8px))}}
@keyframes homeOrbit{to{transform:rotate(335deg)}}

  .home-marquee-track,.home-orbit{animation:none!important}

/* ---------- Apex motion layer ---------- */
.home-particles{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;opacity:.82}
.home-hero-inner,.home-stats{z-index:1}
.home-hero-inner{animation:homeHeroEnter .9s cubic-bezier(.2,.75,.25,1) both}
.home-hero-copy>*{animation:homeTextEnter .75s cubic-bezier(.2,.75,.25,1) both}
.home-hero-copy>*:nth-child(1){animation-delay:.08s}
.home-hero-copy>*:nth-child(2){animation-delay:.17s}
.home-hero-copy>*:nth-child(3){animation-delay:.26s}
.home-hero-copy>*:nth-child(4){animation-delay:.35s}
.home-hero-copy>*:nth-child(5){animation-delay:.44s}
.home-hero-visual{animation:homeVisualFloat 7s ease-in-out infinite}
.home-chip{animation:homeChipPulse 5s ease-in-out infinite}
.home-float-tag{animation:homeTagFloat 5.5s ease-in-out infinite}
.tag-bottom{animation-delay:-2.7s}
.home-spark{animation:homeSpark 3.8s ease-in-out infinite}
.spark-b{animation-delay:-1.8s}
.home-live-dot{animation:homeDotPulse 2s ease-in-out infinite}
.home-stats>div{animation:homeStatRise .65s ease-out both}
.home-stats>div:nth-child(2){animation-delay:.08s}
.home-stats>div:nth-child(3){animation-delay:.16s}
.home-stats>div:nth-child(4){animation-delay:.24s}
.home-reveal{opacity:0;transform:translateY(24px);transition:opacity .75s ease,transform .75s cubic-bezier(.2,.7,.2,1)}
.home-reveal.is-visible{opacity:1;transform:translateY(0)}
.home-journey-card{transform-style:preserve-3d}
.home-journey-card:hover .journey-icon{transform:translateY(-3px) rotate(-7deg);box-shadow:0 8px 18px rgba(16,74,53,.14)}
.journey-icon{transition:transform .25s ease,box-shadow .25s ease}
.home-build-strip{position:relative;overflow:hidden}
.home-build-strip:after{content:"";position:absolute;top:-70%;left:-35%;width:30%;height:240%;transform:rotate(22deg);background:linear-gradient(90deg,transparent,rgba(255,255,255,.13),transparent);animation:homeShimmer 7s ease-in-out infinite;pointer-events:none}
@keyframes homeHeroEnter{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}
@keyframes homeTextEnter{from{opacity:0;transform:translateY(17px)}to{opacity:1;transform:translateY(0)}}
@keyframes homeVisualFloat{0%,100%{translate:0 0}50%{translate:0 -10px}}
@keyframes homeChipPulse{0%,100%{filter:drop-shadow(0 15px 24px rgba(0,0,0,.2)) brightness(1)}50%{filter:drop-shadow(0 18px 34px rgba(216,178,60,.24)) brightness(1.08)}}
@keyframes homeTagFloat{0%,100%{translate:0 0}50%{translate:0 -7px}}
@keyframes homeSpark{0%,100%{opacity:.45;scale:.8;rotate:0deg}50%{opacity:1;scale:1.2;rotate:18deg}}
@keyframes homeDotPulse{0%,100%{box-shadow:0 0 0 0 rgba(123,224,167,.45)}50%{box-shadow:0 0 0 7px rgba(123,224,167,0)}}
@keyframes homeStatRise{from{opacity:0;translate:0 12px}to{opacity:1;translate:0 0}}
@keyframes homeShimmer{0%,65%{left:-35%}100%{left:125%}}
@media(prefers-reduced-motion:reduce){
 .home-hero-inner,.home-hero-copy>*,.home-hero-visual,.home-chip,.home-float-tag,.home-spark,.home-live-dot,.home-stats>div,.home-build-strip:after{animation:none!important}
 .home-reveal{opacity:1;transform:none;transition:none}
}


/* ---------- Product page motion + finishing layer ---------- */
.products-hero{isolation:isolate}
.products-hero:before{content:"";position:absolute;width:440px;height:440px;right:5%;top:-230px;border-radius:50%;background:radial-gradient(circle,rgba(216,178,60,.2),transparent 68%);pointer-events:none;animation:shopGlow 9s ease-in-out infinite alternate}
.products-hero-inner{animation:shopEnter .8s cubic-bezier(.2,.75,.25,1) both}
.products-hero-copy>*{animation:shopTextIn .7s ease both}
.products-hero-copy>*:nth-child(2){animation-delay:.08s}
.products-hero-copy>*:nth-child(3){animation-delay:.16s}
.products-hero-copy>*:nth-child(4){animation-delay:.24s}
.products-hero-art{animation:shopArtFloat 7s ease-in-out infinite}
.products-hero-art .ring-one{animation:shopRing 24s linear infinite}
.products-hero-art .ring-two{animation:shopRing 32s linear infinite reverse}
.products-hero-art .art-chip{transition:transform .35s ease,filter .35s ease}
.products-hero-art:hover .art-chip{transform:translateY(-5px) rotate(-4deg);filter:drop-shadow(0 18px 24px rgba(216,178,60,.25))}
.products-content{position:relative}
.products-heading{position:relative}
.products-kicker{letter-spacing:.2em}
.products-filters{position:relative;overflow:hidden;transition:border-color .2s ease,box-shadow .2s ease}
.products-filters:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(180deg,var(--gold),transparent);opacity:.8}
.products-filters:focus-within{border-color:var(--gold);box-shadow:0 8px 28px rgba(12,59,46,.09)}
.products-filters input,.products-filters select{transition:border-color .18s ease,box-shadow .18s ease,background .18s ease}
.products-filters input:focus,.products-filters select:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,162,39,.13);outline:0}
.products-page .shelf{opacity:1;transform:none}
.products-page .shelf.products-reveal{opacity:0;transform:translateY(22px);transition:opacity .65s ease,transform .65s cubic-bezier(.2,.7,.2,1)}
.products-page .shelf.products-reveal.is-visible{opacity:1;transform:translateY(0)}
.products-page .shelf-row>.product-card{position:relative;isolation:isolate}
.products-page .shelf-row>.product-card:after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;background:linear-gradient(115deg,transparent 20%,rgba(255,255,255,.32) 48%,transparent 72%);opacity:0;transform:translateX(-110%);transition:opacity .25s ease}
.products-page .shelf-row>.product-card:hover:after{opacity:1;animation:shopCardShine .8s ease}
.products-page .product-thumb{position:relative;overflow:hidden}
.products-page .product-thumb:before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 100%,rgba(201,162,39,.12),transparent 65%);pointer-events:none}
.products-page .product-thumb img{transition:transform .45s cubic-bezier(.2,.7,.2,1),filter .3s ease}
.products-page .product-card:hover .product-thumb img{transform:scale(1.055)}
.products-page .product-card .btn{transition:transform .18s ease,box-shadow .18s ease,background .18s ease}
.products-page .product-card .btn:hover{transform:translateY(-2px);box-shadow:0 5px 12px rgba(12,59,46,.13)}
.products-page .shelf-arrows button:active{transform:scale(.94)}
.products-page .empty{border-radius:var(--radius);padding:52px 24px}
@keyframes shopEnter{from{opacity:0;translate:0 14px}to{opacity:1;translate:0 0}}
@keyframes shopTextIn{from{opacity:0;translate:0 12px}to{opacity:1;translate:0 0}}
@keyframes shopArtFloat{0%,100%{translate:0 0}50%{translate:0 -9px}}
@keyframes shopRing{to{rotate:360deg}}
@keyframes shopGlow{from{transform:translate3d(0,0,0) scale(.9);opacity:.55}to{transform:translate3d(-35px,35px,0) scale(1.12);opacity:1}}
@keyframes shopCardShine{0%{transform:translateX(-110%)}100%{transform:translateX(110%)}}
@media(max-width:700px){
 .products-hero-art{animation-duration:9s}
 .products-page .shelf.products-reveal{transform:translateY(14px)}
 .products-page .shelf-row>.product-card:hover{transform:none}
}
@media(prefers-reduced-motion:reduce){
 .products-hero-inner,.products-hero-copy>*,.products-hero-art,.products-hero-art .ring-one,.products-hero-art .ring-two,.products-hero:before{animation:none!important}
 .products-page .shelf.products-reveal{opacity:1;transform:none;transition:none}
 .products-page .product-thumb img,.products-page .product-card .btn{transition:none}
 .products-page .shelf-row>.product-card:after{display:none}
}

/* ---------- Newegg-inspired Apex catalog layout ---------- */

   down before putting a token in here — it explains a real risk.

   1. In your GitHub repo (the one this file lives in), add a file
      called data.json at the repo root containing just: {}
   2. Fill in GITHUB_OWNER, GITHUB_REPO and GITHUB_BRANCH below to match
      your repo (branch is usually "main"). GITHUB_DATA_PATH should
      match the file you made in step 1 ("data.json" if you kept that
      name).
   3. Everyone's browser (customers included) reads data.json straight
      from GitHub — no token needed for that, and it works immediately.
   4. To WRITE (add parts, edit settings, etc.) the site needs a GitHub
      token with permission to push to this one repo. Create one at
      https://github.com/settings/personal-access-tokens/new — under
      "Repository access" choose "Only select repositories" and pick
      this repo, then under "Permissions" set Contents to
      "Read and write". Copy the token (starts with github_pat_).
   5. Sign in as owner on this site, go to Site settings, and paste the
      token into "GitHub write token." It's saved only in that one
      browser's local storage — never written into data.json, never
      synced anywhere — so you'll need to paste it again on any other
      device you want to make edits from.

   IMPORTANT — read this before making a token:
   Anyone who has that token could push commits to this repo as you,
   not just edit the shop's data — a leaked token is a bigger problem
   than a leaked site password. Scoping it to just this one repo (step
   4) limits the damage, but it's still a real credential. Keep it out
   of screenshots, don't paste it into chat, and if you ever suspect
   it leaked, delete it from that GitHub settings page immediately —
   that instantly revokes it, and you can make a new one any time.
   ===================================================================== */

async function fetchRemoteData(){
  const url = `https://raw.githubusercontent.com/${GITHUB_OWNER}/${GITHUB_REPO}/${GITHUB_BRANCH}/${GITHUB_DATA_PATH}?_=${Date.now()}`;
  const res = await fetch(url, {cache:"no-store"});
  if(!res.ok) throw new Error(`GitHub returned ${res.status} fetching ${GITHUB_DATA_PATH} — does that file exist in the repo yet?`);
  const text = await res.text();
  return text.trim() ? JSON.parse(text) : {};
}
async function startCloudSync(){
  loadCart();
  if(!ghConfigured){
    S = loadLocalFallback() || structuredClone(DEFAULTS);
    toast("No shared file configured yet — parts you add here will only show on this device.");
    render();
    return;
  }
  try{
    const d = await fetchRemoteData();
    S = mergeIntoDefaults(d);
    cloudConnected = true; cloudError = "";
  }catch(err){
    console.error(err);
    S = loadLocalFallback() || structuredClone(DEFAULTS);
    cloudConnected = false; cloudError = err.message||String(err);
  }
  render();
  // Poll for changes made from other devices — GitHub has no live push,
  // so this is how another device's edits show up here without a manual reload.
  setInterval(async ()=>{
    if(!ghConfigured) return;
    // Don't redraw the page out from under someone actively typing — that was
    // wiping out unsaved text in forms (settings, checkout, part editor, etc.)
    // every time this ran. Just wait for the next tick once they're done.
    const el = document.activeElement;
    if(el && (el.tagName==="INPUT" || el.tagName==="TEXTAREA" || el.tagName==="SELECT")) return;
    // Only redraw if something actually changed — a redraw snaps every
    // swipeable product row back to its first card.
    const prevConn = cloudConnected, prevErr = cloudError;
    let dataChanged = false;
    try{
      const d = await fetchRemoteData();
      // If we successfully wrote very recently, GitHub's CDN can still hand back
      // the pre-write copy for a bit — trust our own known-good local state
      // instead of letting a stale read overwrite it.
      if(Date.now() - lastLocalWriteAt > 90000){
        const next = mergeIntoDefaults(d);
        if(JSON.stringify(next) !== JSON.stringify(S)){ S = next; dataChanged = true; }
      }
      cloudConnected = true; cloudError = "";
    }catch(err){ cloudConnected = false; cloudError = err.message||String(err); }
    if(dataChanged || prevConn !== cloudConnected || prevErr !== cloudError) render();
  }, 20000);
}

/* Turn GitHub's terse API errors into something that says what to do about it. */
function explainGhError(status, msg){
  const m = String(msg||"");
  if(status===401 || /bad credentials/i.test(m)) return "GitHub rejected the token — it has expired, been revoked, or was pasted wrong. Make a new one, paste it in under Site settings → GitHub write access, then press Test token.";
  if(status===403 && /rate limit/i.test(m)) return "GitHub is rate-limiting this connection. Wait a minute and try again.";
  if(status===403 || /not accessible by personal access token/i.test(m)) return "The token is valid but isn't allowed to change this repository. When creating it, give it access to "+GITHUB_REPO+" and set Contents to 'Read and write'.";
  if(status===404) return "GitHub can't find "+GITHUB_OWNER+"/"+GITHUB_REPO+" with this token — the token wasn't given access to that repository, or the owner/repo name in the file is wrong.";
  if(status===413 || /too large|too big/i.test(m)) return "The data file has grown too large to save — usually from big photos. Use smaller photos, or paste image links instead of uploading.";
  return m ? ("GitHub said: "+m) : ("GitHub returned error "+status);
}
let ghTestMsg = "";
async function testGhToken(){
  const t = ghToken();
  if(!t){ ghTestMsg = "✗ No token is saved on this device. Paste one in above and press Save token."; render(); return; }
  ghTestMsg = "Testing…"; render();
  try{
    const r = await fetch(`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}`, {headers:{Authorization:`Bearer ${t}`, Accept:"application/vnd.github+json"}});
    const j = await r.json().catch(()=>({}));
    const exp = r.headers.get("github-authentication-token-expiration");
    if(!r.ok) ghTestMsg = "✗ "+explainGhError(r.status, j.message);
    else if(j.permissions && j.permissions.push===false) ghTestMsg = "✗ The token can read this repository but can't write to it. Create a new token with Contents set to 'Read and write'.";
    else if(j.permissions) ghTestMsg = "✓ Token is valid and can write to "+GITHUB_OWNER+"/"+GITHUB_REPO+"."+(exp?" It expires "+exp+".":"");
    else ghTestMsg = "✓ Token is valid and can see "+GITHUB_OWNER+"/"+GITHUB_REPO+". (GitHub doesn't report write permission here — if saving still fails, check that Contents is set to 'Read and write'.)"+(exp?" It expires "+exp+".":"");
  }catch(err){ ghTestMsg = "✗ Couldn't reach GitHub — check your internet connection."; }
  render();
}
let githubSaveQueue = Promise.resolve();
function pushToGithub(){
  // Serialize writes so two quick edits cannot race using the same GitHub SHA.
  githubSaveQueue = githubSaveQueue.catch(()=>{}).then(async ()=>{
    const token = ghToken();
    if(!token){
      cloudError = "No GitHub write token saved on this device — add one in Site settings to save changes.";
      cloudConnected = false; toast(cloudError); render();
      return;
    }
    const apiUrl = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${GITHUB_DATA_PATH}`;
    try{
      let saved = false;
      for(let attempt=0; attempt<2 && !saved; attempt++){
        // Always get the current blob SHA immediately before writing.
        const cur = await fetch(apiUrl+`?ref=${GITHUB_BRANCH}&_=${Date.now()}`, {
          cache:"no-store",
          headers:{Authorization:`Bearer ${token}`, Accept:"application/vnd.github+json"}
        });
        const current = await cur.json().catch(()=>({}));
        if(!cur.ok) throw new Error(explainGhError(cur.status, current.message));
        fileSha = current.sha;
        const body = {
          message: "Update site data — "+new Date().toISOString(),
          content: btoa(unescape(encodeURIComponent(JSON.stringify(publicSiteData(),null,2)))),
          branch: GITHUB_BRANCH,
          sha: fileSha
        };
        const res = await fetch(apiUrl, {
          method:"PUT",
          headers:{Authorization:`Bearer ${token}`, Accept:"application/vnd.github+json", "Content-Type":"application/json"},
          body: JSON.stringify(body)
        });
        const result = await res.json().catch(()=>({}));
        if(res.ok){
          fileSha = result.content && result.content.sha;
          lastLocalWriteAt = Date.now();
          cloudConnected = true; cloudError = "";
          saved = true;
        }else if((res.status===409 || res.status===422) && attempt===0){
          fileSha = null; // retry once with a freshly fetched SHA
        }else{
          throw new Error(explainGhError(res.status, result.message));
        }
      }
      if(!saved) throw new Error("GitHub changed the data file during both save attempts. Wait a moment and try again.");
    }catch(err){
      console.error(err);
      cloudConnected = false;
      cloudError = (err instanceof TypeError) ? "Couldn't reach GitHub — check your internet connection." : (err.message||String(err));
      toast("Couldn't save to GitHub — "+cloudError);
    }
    render();
  });
  return githubSaveQueue;
}

/* ---------- part categories & compatibility ---------- */
const CATS = ["CPU","Motherboard","Memory","Graphics card","Storage","Power supply","Case","CPU cooler","Other"];
function socketList(){ return (S.settings.sockets && S.settings.sockets.length) ? S.settings.sockets : DEFAULTS.settings.sockets; }

function listSpec(value){
  return String(value||"").split(/[,;|]/).map(x=>x.trim().toLowerCase()).filter(Boolean);
}
function currentChosenParts(){
  return CATS.map(cat=>buildSel[cat] ? partsAll().find(p=>p.id===buildSel[cat]) : null).filter(Boolean);
}
/* Normalize board sizes so ATX boards never slip into mATX-only cases.
   Prefer explicit catalog fields, then infer from the manufacturer's product text. */
function normalizeBoardSize(value){
  const s=String(value||"").toLowerCase().replace(/[_\s]+/g," ").trim();
  if(/e\s*[- ]?atx|extended atx/.test(s)) return "e-atx";
  if(/micro\s*[- ]?atx|\bmatx\b/.test(s)) return "micro-atx";
  if(/mini\s*[- ]?itx|\bitx\b/.test(s)) return "mini-itx";
  if(/\batx\b/.test(s)) return "atx";
  return "";
}
function inferBoardSize(board){
  return normalizeBoardSize(board?.formFactor) ||
    normalizeBoardSize([board?.name,board?.desc,board?.longDesc].filter(Boolean).join(" "));
}
function supportedCaseBoardSizes(pcCase){
  const explicit=listSpec(pcCase?.caseFormFactors).map(normalizeBoardSize).filter(Boolean);
  if(explicit.length) return [...new Set(explicit)];
  const text=[pcCase?.name,pcCase?.desc,pcCase?.longDesc].filter(Boolean).join(" ");
  const inferred=normalizeBoardSize(text);
  if(inferred==="micro-atx") return ["micro-atx","mini-itx"];
  if(inferred==="mini-itx") return ["mini-itx"];
  if(inferred==="atx") return ["atx","micro-atx","mini-itx"];
  if(inferred==="e-atx") return ["e-atx","atx","micro-atx","mini-itx"];
  return [];
}
function gpuLengthMm(gpu){
  const direct=+(gpu?.lengthMm||0);
  if(direct>0) return direct;
  const text=[gpu?.desc,gpu?.longDesc].filter(Boolean).join(" ");
  const m=text.match(/(?:card|graphics card|gpu)?\s*length\s*[:：-]?\s*(\d{2,3}(?:\.\d+)?)\s*mm|\b(\d{2,3}(?:\.\d+)?)\s*mm\s*(?:long|length)\b/i);
  return m?+(m[1]||m[2]):0;
}
function caseGpuClearanceMm(pcCase){
  const direct=+(pcCase?.maxGpuLengthMm||0);
  if(direct>0) return direct;
  const text=[pcCase?.desc,pcCase?.longDesc].filter(Boolean).join(" ");
  const m=text.match(/(?:graphics card|gpu|video card)(?:s)?[^.]{0,45}?up to\s*(\d{2,3}(?:\.\d+)?)\s*mm|up to\s*(\d{2,3}(?:\.\d+)?)\s*mm[^.]{0,30}?(?:graphics card|gpu)/i);
  return m?+(m[1]||m[2]):0;
}
/* Missing measurements are a "check fit" warning, never a false promise. */
function compatibilityReview(part,cpu,need,chosen=currentChosenParts()){
  const fails=[], warnings=[];
  const get=cat=>chosen.find(p=>p.category===cat);
  const board=part.category==="Motherboard"?part:get("Motherboard");
  const gpu=part.category==="Graphics card"?part:get("Graphics card");
  const ram=part.category==="Memory"?part:get("Memory");
  const cooler=part.category==="CPU cooler"?part:get("CPU cooler");
  const psu=part.category==="Power supply"?part:get("Power supply");
  const pcCase=part.category==="Case"?part:get("Case");
  if(part.category==="Power supply"){
    const watts=+part.watts||0;
    const target=recommendedPSUWatts(need);
    if(!watts || watts<target) fails.push(`PSU output is below the ${target} W recommendation (including ${psuSafetyMargin}% headroom)`);
  }
  if(cpu && part.category==="Motherboard"){
    if(part.socket && cpu.socket && part.socket!==cpu.socket) fails.push("Motherboard socket does not match the CPU");
    else if(!part.socket || !cpu.socket) warnings.push("Confirm the CPU and motherboard socket match");
    if(part.memType && cpu.memType && part.memType!==cpu.memType) fails.push("Motherboard memory type does not match the CPU");
    else if(!part.memType || !cpu.memType) warnings.push("Confirm supported memory generation");
  }
  if(cpu && part.category==="Memory" && part.memType && cpu.memType && part.memType!==cpu.memType) fails.push("Memory generation does not match the CPU platform");
  if(cpu && part.category==="CPU cooler"){
    const sockets=listSpec(part.supportedSockets||part.socket);
    if(sockets.length && cpu.socket && !sockets.includes(cpu.socket.toLowerCase())) fails.push("Cooler does not list support for this CPU socket");
    else if(!sockets.length) warnings.push("Confirm cooler socket support");
  }
  if(board && pcCase){
    const boardSize=inferBoardSize(board);
    const supported=supportedCaseBoardSizes(pcCase);
    if(boardSize && supported.length && !supported.includes(boardSize)) fails.push("Motherboard form factor ("+boardSize+") is not supported by this case");
    else if(!boardSize || !supported.length) warnings.push("Confirm motherboard and case form-factor compatibility");
  }
  if(gpu && pcCase){
    const length=gpuLengthMm(gpu), clearance=caseGpuClearanceMm(pcCase);
    if(length && clearance && length>clearance) fails.push("Graphics card is longer than the case clearance");
    else if(!length || !clearance) warnings.push("Confirm graphics-card length against case clearance");
  }
  if(cooler && pcCase && cooler.coolingType==="Liquid"){
    warnings.push("Confirm case support for a "+cooler.radiatorSizeMm+"mm radiator and fan assembly clearance");
  }
  if(cooler && pcCase && cooler.coolingType!=="Liquid"){
    const height=+(cooler.heightMm||0), clearance=+(pcCase.maxCoolerHeightMm||0);
    if(height && clearance && height>clearance) fails.push("CPU cooler is taller than the case clearance");
    else if(!height || !clearance) warnings.push("Confirm CPU-cooler height against case clearance");
  }
  if(ram && cooler && cooler.coolingType!=="Liquid"){
    const height=+(ram.heightMm||0), clearance=+(cooler.maxRamHeightMm||0);
    if(height && clearance && height>clearance) fails.push("RAM is taller than the cooler's available memory clearance");
    else if(!height || !clearance) warnings.push("Confirm RAM height and CPU-cooler memory clearance");
  }
  if(psu && pcCase){
    const supported=listSpec(pcCase.supportedPSUFormFactors);
    if(psu.formFactor && supported.length && !supported.includes(String(psu.formFactor).toLowerCase())) fails.push("PSU form factor is not supported by the case");
    else if(!psu.formFactor || !supported.length) warnings.push("Confirm PSU and case form-factor compatibility");
  }
  if(gpu && psu){
    const required=listSpec(gpu.requiredPowerConnectors), available=listSpec(psu.gpuPowerConnectors);
    if(required.length && available.length && required.some(x=>!available.includes(x))) fails.push("PSU does not list all required GPU power connectors");
    else if(required.length && !available.length) warnings.push("Confirm the PSU has the GPU's required power connectors");
  }
  return {fits:fails.length===0, fails, warnings};
}
function fitsCPU(part,cpu,need,chosen){ return compatibilityReview(part,cpu,need,chosen).fits; }
/* Sums the CPU's own TDP plus the power-draw field on every other selected
   part (graphics card mainly) to get the watts the build actually needs —
   then only power supplies rated at or above that number are shown as fits. */
function requiredWatts(cpu, chosenExcludingPSU){
  const cpuW = cpu ? (+cpu.tdp||0) : 0;
  const restW = chosenExcludingPSU.reduce((n,p)=>n+(+p.power||0),0);
  return cpuW + restW;
}
function recommendedPSUWatts(baseWatts){
  return Math.ceil(((+baseWatts||0)*(1+psuSafetyMargin/100))/10)*10;
}

let homeMotionCleanup=null;
function setupHomeMotion(){
  if(homeMotionCleanup) homeMotionCleanup();
  const canvas=document.querySelector(".home-particles");
  if(!canvas) return;
  const ctx=canvas.getContext("2d");
  if(!ctx) return;
  const reduce=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const coarse=window.matchMedia("(pointer: coarse)").matches;
  let width=0,height=0,raf=0,particles=[],observer=null,pointer={x:-1000,y:-1000};
  const animate=!reduce&&!coarse;
  const dpr=Math.min(window.devicePixelRatio||1,coarse?1:1.6);
  function resize(){
    const rect=canvas.getBoundingClientRect();
    width=rect.width;height=rect.height;
    canvas.width=Math.max(1,Math.floor(width*dpr));
    canvas.height=Math.max(1,Math.floor(height*dpr));
    ctx.setTransform(dpr,0,0,dpr,0,0);
    const count=coarse?18:Math.max(24,Math.min(78,Math.floor(width*height/10500)));
    particles=Array.from({length:count},()=>({
      x:Math.random()*width,y:Math.random()*height,
      vx:(Math.random()-.5)*.24,vy:(Math.random()-.5)*.24,
      r:Math.random()*1.7+.65,phase:Math.random()*Math.PI*2
    }));
    draw(0);
  }
  function draw(t){
    if(!canvas.isConnected){cancelAnimationFrame(raf);return;}
    ctx.clearRect(0,0,width,height);
    const link=coarse?0:135;
    for(let i=0;i<particles.length;i++){
      const p=particles[i];
      if(!reduce){
        p.x+=p.vx;p.y+=p.vy;
        if(p.x<-8)p.x=width+8;if(p.x>width+8)p.x=-8;
        if(p.y<-8)p.y=height+8;if(p.y>height+8)p.y=-8;
        if(!coarse){
          const dx=p.x-pointer.x,dy=p.y-pointer.y,dist=Math.hypot(dx,dy);
          if(dist<125&&dist>0){p.x+=(dx/dist)*.32;p.y+=(dy/dist)*.32;}
        }
      }
      const glow=.55+.3*Math.sin((t||0)*.001+p.phase);
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle="rgba(216,178,60,"+(reduce ? 0.55 : glow)+")";ctx.fill();
      for(let j=i+1;j<particles.length;j++){
        const q=particles[j],dx=p.x-q.x,dy=p.y-q.y,d=Math.hypot(dx,dy);
        if(d<link){
          ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(q.x,q.y);
          ctx.strokeStyle="rgba(144,211,171,"+((1-d/link)*.2)+")";
          ctx.lineWidth=.7;ctx.stroke();
        }
      }
    }
    if(animate) raf=requestAnimationFrame(draw);
  }
  function move(e){const rect=canvas.getBoundingClientRect();pointer.x=e.clientX-rect.left;pointer.y=e.clientY-rect.top;}
  resize();
  if(animate){
    canvas.addEventListener("pointermove",move,{passive:true});
    window.addEventListener("resize",resize,{passive:true});
    raf=requestAnimationFrame(draw);
  }
  const reveals=document.querySelectorAll(".home-reveal");
  if("IntersectionObserver" in window){
    observer=new IntersectionObserver(entries=>entries.forEach(entry=>{
      if(entry.isIntersecting){entry.target.classList.add("is-visible");observer.unobserve(entry.target);}
    }),{threshold:.12});
    reveals.forEach(el=>observer.observe(el));
  }else reveals.forEach(el=>el.classList.add("is-visible"));
  homeMotionCleanup=()=>{
    cancelAnimationFrame(raf);
    canvas.removeEventListener("pointermove",move);
    window.removeEventListener("resize",resize);
    if(observer) observer.disconnect();
    homeMotionCleanup=null;
  };
}

/* ---- Products and Build-a-PC parts share one catalog ----
   A part added on Build a PC also shows on the Products page under its category.
   A product added on the Products page with a PC-part category (CPU, Motherboard,
   Memory…) also shows on Build a PC. Nothing is copied, so edits stay in sync. */
const isPartCat = c => CATS.includes(c) && c!=="Other";
const nameKey = p => String(p.category||"")+"|"+String(p.name||"").trim().toLowerCase();
function dupeOfPart(p){ return isPartCat(p.category) && S.parts.some(x=>nameKey(x)===nameKey(p)); }
function partsAll(){ return [...S.parts, ...S.products.filter(p=>isPartCat(p.category) && !dupeOfPart(p))]; }
function catalogAll(){ return [...S.products.filter(p=>p.active!==false && !dupeOfPart(p)), ...S.parts]; }
function displayCat(p){ return (S.parts.includes(p) && p.category==="Other") ? "Other parts" : (p.category||""); }
function findRec(id){
  let rec = S.products.find(x=>x.id===id); if(rec) return {rec, arr:S.products, kind:"product"};
  rec = S.parts.find(x=>x.id===id); return rec ? {rec, arr:S.parts, kind:"part"} : null;
}
function editItem(id){ const f=findRec(id); if(!f) return; if(f.kind==="product") editProduct(id); else editPart(id); }
function delItem(id){ const f=findRec(id); if(!f) return; if(f.kind==="product") delProduct(id); else delPart(id); }

function productDetail(id){
  const f = findRec(id); if(!f) return;
  if(f.rec.active===false){toast("This product is temporarily unavailable while Newegg is backordered.");return;}
  if(f.kind==="part" || isPartCat(f.rec.category)) return partDetail(id,"products");
  const p = f.rec;
  detailDialog({
    image:p.image, name:p.name, price:p.price,
    badge:p.featured?`<span class="badge-feat">★ Featured</span>`:"",
    rows:[["Category",p.category],["Processor",[p.cpuType,p.processor].filter(Boolean).join(" · ")],["Brand",p.brand]],
    summary:p.desc, full:p.longDesc,
    actions:`<button class="btn gold" onclick="addToCart(${cartPayload(p)});editDlg.close()">Add to cart</button>`
      +(staffCan("view_notes")?`<button class="btn ghost" data-note-id="${esc(p.id)}" onclick="staffOpenNotes('product',this.dataset.noteId)">Staff notes</button>`:"")
      +(isOwner?`<button class="btn ghost" onclick="editProduct('${p.id}')">Edit</button>`:"")
  });
}
function currentBuildNeed(){
  const cpu = buildSel["CPU"] ? partsAll().find(p=>p.id===buildSel["CPU"]) : null;
  const rest = Object.entries(buildSel).filter(([c])=>c!=="CPU" && c!=="Power supply")
    .map(([,id])=>partsAll().find(p=>p.id===id)).filter(Boolean);
  return {cpu, need: requiredWatts(cpu, rest)};
}
function partDetail(id,ctx){
  const p = partsAll().find(x=>x.id===id); if(!p) return;
  const {cpu, need} = currentBuildNeed();
  const picked = buildSel[p.category]===p.id;
  const review=compatibilityReview(p,cpu,need);
  const note = review.fails.length
    ? `<p class="nofit" style="font-size:.9rem">⚠ ${esc(review.fails.join("; "))}</p>`
    : review.warnings.length
      ? `<p class="nofit" style="font-size:.86rem">Check fit: ${esc(review.warnings.join("; "))}</p>`
      : (cpu && p.category!=="CPU" ? `<p class="fit" style="font-size:.9rem">✓ No compatibility conflicts found with the selected CPU</p>` : "");
  detailDialog({
    image:p.image, name:p.name, price:p.price, note,
    rows:[["Category",p.category],["Brand",p.brand],["CPU type",p.cpuType],["Socket",p.socket],["Memory type",p.memType],
          ...(p.category==="CPU"&&p.tdp?[["CPU TDP",p.tdp+" W"]]:[]),
          ...(p.category==="Power supply"&&p.watts?[["PSU output",p.watts+" W"]]:[]),
          ...(p.category==="Power supply"&&p.efficiency?[["Efficiency",p.efficiency]]:[]),
          ...(p.category==="Power supply"&&p.modular?[["Modularity",p.modular]]:[]),
          ...(p.category==="Power supply"&&p.formFactor?[["Form factor",p.formFactor]]:[]),
          ...(p.category==="Power supply"&&p.atxStandard?[["ATX standard",p.atxStandard]]:[]),

/* Small scroll-reveal layer for the catalog. Content remains visible if motion is reduced. */
let productsMotionCleanup=null;
function setupProductsMotion(){
  if(productsMotionCleanup) productsMotionCleanup();
  const page=document.querySelector(".products-page");
  if(!page) return;
  const reduce=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(reduce) return;
  const targets=[...page.querySelectorAll(".products-heading,.products-filters,.products-page .shelf")];
  if(!("IntersectionObserver" in window)){return;}
  const observer=new IntersectionObserver(entries=>{
    entries.forEach(entry=>{
      if(entry.isIntersecting){
        entry.target.classList.add("is-visible");
        observer.unobserve(entry.target);
      }
    });
  },{threshold:.08,rootMargin:"0px 0px -35px 0px"});
  targets.forEach((el,i)=>{
    if(el.classList.contains("shelf")) el.classList.add("products-reveal");
    else el.classList.add("products-reveal");
    el.style.transitionDelay=Math.min(i*55,330)+"ms";
    observer.observe(el);
  });
  productsMotionCleanup=()=>observer.disconnect();
}

function pickRow(p,cat,ok,chosenParts,buildNeed){
  const sel = buildSel[cat]===p.id;
  const spentElsewhere = Object.entries(buildSel).filter(([c])=>c!==cat).reduce((sum,[,id])=>{const chosen=partsAll().find(x=>x.id===id);return sum+(+chosen?.price||0);},0);
  const budgetRoom = buildBudget>0 ? buildBudget-spentElsewhere : null;
  const withinBudget = budgetRoom===null || (+p.price||0)<=budgetRoom;
  const spec = [p.cpuType,p.socket,p.memType,p.watts?p.watts+"W output":"",p.tdp?p.tdp+"W TDP":"",p.power?p.power+"W draw":"",p.lengthMm?p.lengthMm+"mm long":"",p.formFactor||""].filter(Boolean).join(" · ");
  const reviewCPU=chosenParts?chosenParts.find(x=>x.category==="CPU"):(buildSel["CPU"]?partsAll().find(x=>x.id===buildSel["CPU"]):null);
  const review = compatibilityReview(p,reviewCPU,buildNeed??currentBuildNeed().need,chosenParts||currentChosenParts());
  const label = !ok ? "doesn't fit" : review.warnings.length ? "check fit" : "fits";
  const tip = [...review.fails,...review.warnings].join("; ");
  return `<div class="pick ${sel?'sel':''}">
    <div class="row" style="flex:1;min-width:0;cursor:pointer" title="Tap for full details" onclick="partDetail('${p.id}')">
      ${p.image?`<img loading="lazy" decoding="async" src="${esc(p.image)}" alt="" style="width:52px;height:52px;object-fit:cover;border-radius:4px;flex:none">`:""}
      <div><strong>${esc(p.name)}</strong> <span class="${ok&&!review.warnings.length?'fit':'nofit'}" title="${esc(tip)}">${label}</span> <span class="muted" style="font-size:.74rem;text-decoration:underline">details ›</span>
        ${tip?`<small class="nofit">${esc(tip)}</small>`:""}
        <small>${esc(p.desc||"")}${spec?` — ${esc(spec)}`:""}</small></div>
    </div>
    <div class="row" style="flex:none">
      <span class="price" style="font-size:1rem">${money(p.price)}${buildBudget?`<small class="budget-fit ${withinBudget?"":"over"}">${withinBudget?"Within budget":"Over remaining"}</small>`:""}</span>
      <button class="btn sm ${sel?'ghost':''}" onclick="pickPart('${cat}','${p.id}')">${sel?"Remove":"Choose"}</button>
      ${isOwner?`<button class="btn sm ghost" onclick="editItem('${p.id}')">Edit</button><button class="btn sm danger" onclick="delItem('${p.id}')">×</button>`:""}
    </div></div>`;
}
function pickPart(cat,id){
  const had = buildSel[cat]===id;
  if(had) delete buildSel[cat]; else buildSel[cat]=id;
  if(!had&&(cat==="Motherboard"||cat==="Graphics card")&&buildSel.Case){
    const chosen=CATS.map(c=>partsAll().find(p=>p.id===buildSel[c])).filter(Boolean);
    const cpu=partsAll().find(p=>p.id===buildSel.CPU)||null;
    const watts=requiredWatts(cpu,chosen.filter(p=>p.category!=="CPU"&&p.category!=="Power supply"));
    const existingCase=chosen.find(p=>p.category==="Case");
    if(existingCase&&!compatibilityReview(existingCase,cpu,watts,chosen).fits)delete buildSel.Case;
  }
  saveBuild(); render();
  if(route()!=="/build") toast(had ? "Removed from your build list." : "Added to your build list — see it on Build a PC.");
}
function addBuildToCart(){
  const chosen = CATS.map(cat=>buildSel[cat]).map(id=>partsAll().find(p=>p.id===id)).filter(Boolean);
  if(!chosen.length) return;
  const price = chosen.reduce((n,p)=>n+(+p.price||0),0) + (wantAssembly?(+S.settings.buildFee||0):0);
  addToCart({id:uid(),kind:"build",qty:1,name:"Custom PC build"+(wantAssembly?" (assembled by us)":" (parts only)"),price,
    parts:chosen.map(p=>({id:p.id,name:p.name,category:p.category,price:+p.price||0})), assembly:wantAssembly, fee:wantAssembly?(+S.settings.buildFee||0):0});
  buildSel={}; wantAssembly=false; saveBuild();
}

    items:structuredClone(myCart),sub:t.sub,shipping:t.shipping,tax:t.tax,total:t.total,status:"requested"};
  const form=e.target;
  const btn=e.submitter||form.querySelector('button[type="submit"]');
  if(btn){btn.disabled=true;btn.textContent="Saving order…";}
  try{
    await promoValidateCheckout();
    const {error}=await supabaseClient.from("apex_orders").insert([{id:o.id,ref:o.ref,created_at:o.at,customer_name:o.name,customer_email:o.email,customer_phone:o.phone,shipping_address:o.address,notes:o.notes,items:o.items,subtotal:o.sub,shipping:o.shipping,tax:o.tax,total:o.total,status:o.status,...(checkoutPromo.code?{promo_code:checkoutPromo.code}:{}),...(customerHandoff?.kind==="order"?{handoff_token:customerHandoff.token}:{})}]);
    if(error) throw error;
    if(customerHandoff?.kind==="order")salesForgetHandoff();
    lastOrder=o;
    form.querySelectorAll("input,textarea,button[type=submit]").forEach(el=>el.disabled=true);
    const payment=document.getElementById("paypalPayment");
    payment.hidden=false;
    document.getElementById("paypalStatus").textContent="Order "+o.ref+" saved. Complete your payment securely with PayPal below.";
    paypal.Buttons({
      style:{layout:"vertical",color:"gold",shape:"rect",label:"paypal"},
      createOrder:async function(){
        const {data,error}=await supabaseClient.functions.invoke("paypal-checkout",{body:{action:"create",orderId:o.id}});
        if(error) throw new Error(error.message||"Could not start PayPal checkout.");
        if(!data||!data.id) throw new Error(data?.error||"PayPal did not return an order ID.");
        if(checkoutPromo.code&&!data.pricing)throw new Error("Promo checkout is not activated yet. Contact Apex before paying.");
        if(data.pricing){o.sub=Number(data.pricing.subtotal);o.shipping=Number(data.pricing.shipping);o.tax=Number(data.pricing.tax);o.total=Number(data.pricing.total);o.discount=Number(data.pricing.discount);document.getElementById("paypalStatus").textContent="Verified payment total: "+money(o.total)+(o.discount?" (discount "+money(o.discount)+")":"");}
        return data.id;
      },
      onApprove:async function(data){
        document.getElementById("paypalStatus").textContent="Payment received by PayPal. Verifying it now…";
        const {data:result,error}=await supabaseClient.functions.invoke("paypal-checkout",{body:{action:"capture",orderId:o.id,paypalOrderId:data.orderID}});
        if(error) throw new Error(error.message||"Payment verification failed.");
        if(!result||!result.success) throw new Error(result?.error||"PayPal could not verify the payment.");
        o.status="paid";
        myCart=[];checkoutPromo={code:"",discount:0,subtotal:null};saveCart();
        o.notificationsPending=!!result.notificationsPending;
        go("/done");
      },
      onCancel:function(){
        document.getElementById("paypalStatus").textContent="Payment was cancelled. Your order is saved but not paid. You can try PayPal again below.";
      },
      onError:function(err){
        console.error("PayPal checkout error:",err);
        document.getElementById("paypalStatus").textContent="PayPal had a problem. Your order is saved but not marked paid. Please try again or contact Apex Computers.";
      }
    }).render("#paypalButtons");
  }catch(err){
    console.error("Order submission failed:",err);
    toast("Checkout couldn't start: "+(err.message||"Please try again."));
    if(btn){btn.disabled=false;btn.textContent="Continue to PayPal";}
  }
  return false;
}

async function deleteWorkItem(kind,id){
  if(!isOwner || !["order","request"].includes(kind) || !id) return;
  const label = kind==="order" ? "order" : "service request";
  if(!confirm("Mark this "+label+" as done and permanently delete it? This cannot be undone.")) return;
  const table = kind==="order" ? "apex_orders" : "apex_service_requests";
  const {error}=await supabaseClient.from(table).delete().eq("id",id);
  if(error){toast("Could not delete the "+label+": "+error.message);return;}
  if(kind==="order"){
    cloudOrders=cloudOrders.filter(x=>x.id!==id);
    S.orders=(S.orders||[]).filter(x=>x.id!==id);
  }else{
    cloudRequests=cloudRequests.filter(x=>x.id!==id);
    S.requests=(S.requests||[]).filter(x=>x.id!==id);
  }
  render();
  toast("The "+label+" was deleted.");
}
function findOrder(orderId){return cloudOrders.find(x=>x.id===orderId)||(S.orders||[]).find(x=>x.id===orderId);}
async function updateOrderStatus(o,status){
  if(cloudOrders.some(x=>x.id===o.id)){
    const {error}=await supabaseClient.from("apex_orders").update({status}).eq("id",o.id);
    if(error){toast("Could not update the online order: "+error.message);return false;}
    o.status=status;
  }else{o.status=status;save();}
  return true;
}
function replyToRequest(reqId){
  const r = S.requests.find(x=>x.id===reqId); if(!r) return;
  const body = `Hi ${r.name},\n\nGot your request about: ${r.issue}\n\nLet's get you scheduled — `;
  mailCustomer(r.email, "Re: your service request", body);
}
async function mailCustomer(to,subject,body){
  const {data,error} = await supabaseClient.functions.invoke("send-gmail", {
    body: { to, subject, body }
  });
  if(error || !data?.success){
    console.error("Gmail send failed:", error || data?.error);
    copyText(body);
    toast("Email could not be sent: "+(data?.error || error?.message || "Please try again."));
    return false;
  }
  toast("Email sent successfully to "+to+".");
  return true;
}
async function sendInvoice(orderId){
  const o=findOrder(orderId); if(!o) return;
  if(!await updateOrderStatus(o,"invoiced")) return;
  await mailCustomer(o.email, `Invoice for order ${o.ref}`, invoiceText(o));
  render();
}
const STATUS_TEXT = {
  working: {subj:"Your order is being worked on", line:"Wanted to let you know we've started work on your order."},
  shipped: {subj:"Your order has shipped", line:"Your order is on its way."},
  delivered: {subj:"Your order has been delivered", line:"Your order has been delivered. Thanks for going with us!"}
};
async function sendStatusEmail(orderId, statusKey){
  const o=findOrder(orderId); if(!o) return;
  const t=STATUS_TEXT[statusKey]; if(!t) return;
  if(!await updateOrderStatus(o,statusKey)) return;
  const body = `Hi ${o.name},\n\n${t.line}\n\nOrder ${o.ref}:\n`+o.items.map(i=>`- ${i.name}`).join("\n")+
    `\n\nQuestions? Just reply to this email.\n\n${S.settings.shopName||"Apex Computers"}`;
  await mailCustomer(o.email, `${t.subj} — ${o.ref}`, body);
  render();
}

   "Add a new one…" and type it. New entries are remembered in Site settings. */
function selectWithAdd(id, key, current, blankLabel, opts){
  opts = opts || {};
  const extra = opts.extra || [];
  const list = S.settings[key] || [];
  const all = (current && !list.includes(current) && !extra.includes(current)) ? [...list, current] : list;
  const optHtml = o => `<option value="${esc(o)}" ${o===current?"selected":""}>${esc(o)}</option>`;
  return `<select id="${id}" onchange="selAddToggle('${id}');${opts.onchange||""}">
    ${blankLabel!=null?`<option value="">${esc(blankLabel)}</option>`:""}
    ${extra.length?`<optgroup label="Products">`:""}${all.map(optHtml).join("")}${extra.length?`</optgroup><optgroup label="${esc(opts.extraLabel||"More")}">${extra.map(optHtml).join("")}</optgroup>`:""}
    <option value="__new__">➕ Add a new one…</option>
  </select>
  <input id="${id}_new" placeholder="Type the new name" style="display:none;margin-top:8px">`;
}
function selAddToggle(id){
  const s = document.getElementById(id), n = document.getElementById(id+"_new");
  if(!s || !n) return;
  n.style.display = s.value==="__new__" ? "block" : "none";
  if(s.value==="__new__") n.focus();
}
function readSelectWithAdd(id, key){
  const s = document.getElementById(id); if(!s) return "";
  if(s.value !== "__new__") return s.value;
  const v = (document.getElementById(id+"_new").value||"").trim();
  if(!v) return "";
  const list = S.settings[key] = S.settings[key] || [];
  const hit = list.find(x=>x.toLowerCase()===v.toLowerCase());
  if(hit) return hit;
  list.push(v);
  return v;
}

function handleImageUpload(e, fieldId, previewId){
  const file = e.target.files[0]; if(!file) return;
  if(!file.type.startsWith("image/")){ toast("That's not an image file."); return; }
  const reader = new FileReader();
  reader.onload = function(ev){
    const img = new Image();
    img.onload = function(){
      const maxW = 900;
      const scale = Math.min(1, maxW/img.width);
      const w = Math.round(img.width*scale), h = Math.round(img.height*(scale));
      const canvas = document.createElement("canvas");
      canvas.width = w; canvas.height = h;
      canvas.getContext("2d").drawImage(img,0,0,w,h);
      const dataUrl = canvas.toDataURL("image/jpeg", 0.72);
      const field = document.getElementById(fieldId);
      if(field){ field.value = dataUrl; }
      const prev = document.getElementById(previewId);
      if(prev){ prev.innerHTML = `<img src="${dataUrl}" style="max-height:130px;border-radius:4px;display:block">`; }
      toast("Photo ready — click Save to keep it.");
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

        <div class="field" id="q_tdp_wrap"><label>CPU TDP (W)</label><input id="q_tdp" type="number" value="${p.tdp||""}"></div>
        <div class="field" id="q_watts_wrap"><label>PSU output (W)</label><input id="q_watts" type="number" value="${p.watts||""}"></div>
      </div>
      <div class="field" id="q_power_wrap"><label>Power draw (W) — component power consumption</label><input id="q_power" type="number" value="${p.power||""}"></div>
      <p class="muted" style="font-size:.82rem">Socket and memory type are what the builder matches boards/coolers/memory on. CPU TDP, and power draw on every other part (mainly the graphics card), are what it adds up to size the power supply. Brand feeds the filter dropdown on this page.</p>
    </div>
    <div class="row"><button class="btn gold" onclick="savePart('${p.id}',${!!id})">Save</button>
    <button class="btn ghost" onclick="editDlg.close()">Cancel</button></div></div>`;
  openDlg(html);
  toggleSpecs();
}
function savePart(id,exists){
  const rec = {id,name:q_name.value.trim(),category:q_cat.value,brand:q_brand.value.trim(),price:+q_price.value||0,desc:q_desc.value.trim(),longDesc:q_long.value.trim(),
    image:q_img.value.trim(),socket:readSelectWithAdd("q_sock","sockets"),
    cpuType:(q_cat.value==="CPU"?readSelectWithAdd("q_cpu","cpuTypes"):""),
    memType:q_mem.value,
    tdp:q_cat.value==="CPU"?q_tdp.value:"",
    watts:q_cat.value==="Power supply"?q_watts.value:"",
    power:(q_cat.value!=="CPU"&&q_cat.value!=="Power supply")?q_power.value:"",
    formFactor:(q_cat.value==="Power supply"?q_psu_form_factor.value:q_form_factor.value).trim(),
    caseFormFactors:q_case_form_factors.value.trim(),
    lengthMm:q_length_mm.value, maxGpuLengthMm:q_max_gpu_mm.value,
    heightMm:q_cat.value==="Memory"?q_ram_height_mm.value:q_height_mm.value,
    maxCoolerHeightMm:q_max_cooler_mm.value, maxRamHeightMm:q_max_ram_mm.value,
    supportedSockets:q_supported_sockets.value.trim(),
    supportedPSUFormFactors:q_psu_supported.value.trim(),
    requiredPowerConnectors:q_gpu_connectors.value.trim(),
    gpuPowerConnectors:q_psu_connectors.value.trim()};
  if(!rec.name){ toast("Give it a name first."); return; }
  if(exists) S.parts = S.parts.map(x=>x.id===id?rec:x); else S.parts.push(rec);
  save(); editDlg.close(); render(); toast("Part saved.");
}
function delPart(id){ if(confirm("Delete this part?")){ S.parts=S.parts.filter(x=>x.id!==id); Object.keys(buildSel).forEach(k=>{if(buildSel[k]===id)delete buildSel[k]}); saveBuild(); save(); render(); } }
function toggleSpecs(){
  const box = document.getElementById("cpuTypeBox"), cat = document.getElementById("q_cat");
  if(box && cat) box.style.display = cat.value==="CPU" ? "" : "none";
  updatePowerSpecFields("q",cat&&cat.value);
}
function updatePowerSpecFields(prefix,category){
  const show=(id,visible)=>{const el=document.getElementById(prefix+"_"+id+"_wrap");if(el)el.style.display=visible?"":"none";};
  show("tdp",category==="CPU");
  show("watts",category==="Power supply");
  show("power",category!=="CPU"&&category!=="Power supply");
}

function editText(key,label){
  if(!isOwner) return;
  openDlg(`<div class="dlg"><h3>Edit ${esc(label)} page</h3>
    <div class="field"><textarea id="t_val" style="min-height:200px">${esc(S.settings[key]||"")}</textarea></div>
    <div class="row"><button class="btn gold" onclick="S.settings['${key}']=t_val.value;save();editDlg.close();render();toast('Page saved.')">Save</button>
    <button class="btn ghost" onclick="editDlg.close()">Cancel</button></div></div>`);
}
let editDlg = null;
function openDlg(html){
  if(editDlg) editDlg.remove();
  editDlg = document.createElement("dialog");
  editDlg.innerHTML = html;
  document.body.appendChild(editDlg);
  editDlg.showModal();
}

/* ---------- backup ---------- */
function exportData(){
  const blob = new Blob([JSON.stringify(S,null,2)],{type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "apex-computers-backup.json"; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function importData(input){
  const f = input.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => { try{ S = Object.assign(structuredClone(DEFAULTS), JSON.parse(r.result)); save(); render(); toast("Backup loaded."); }
    catch(e){ toast("That file didn't read as a backup."); } };
  r.readAsText(f);
}

/* ---------- misc ---------- */
let toastT = null;
function toast(msg){
  document.querySelectorAll(".toast").forEach(t=>t.remove());
  const d = document.createElement("div"); d.className="toast"; d.textContent=msg;
  document.body.appendChild(d); clearTimeout(toastT); toastT = setTimeout(()=>d.remove(),3200);
}
