<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apex Computers — Custom PCs, Parts &amp; Tech Service</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --board:#0C3B2E; --board-2:#082A20; --gold:#C9A227; --gold-2:#8E7118;
  --silk:#F3F6F2; --paper:#EAEFEA; --panel:#FFFFFF; --ink:#14201B;
  --ink-2:#4A5952; --line:#C9D3CC; --alert:#B23B26; --ok:#1E6E4F;
  --radius:3px; --wrap:1120px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F1614; --panel:#16201C; --ink:#E8EEE9; --ink-2:#9FB0A7;
    --line:#2C3A34; --silk:#F3F6F2; --gold:#D8B23C;
  }
}
:root[data-theme="dark"]{
  --paper:#0F1614; --panel:#16201C; --ink:#E8EEE9; --ink-2:#9FB0A7;
  --line:#2C3A34; --gold:#D8B23C;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:16px; line-height:1.55; -webkit-text-size-adjust:100%;
}
h1,h2,h3,h4{font-family:Archivo,"IBM Plex Sans",sans-serif;font-weight:800;letter-spacing:-.02em;margin:0 0 .4em;line-height:1.08}
h1{font-size:clamp(2rem,5.4vw,3.4rem)}
h2{font-size:clamp(1.5rem,3.2vw,2.1rem)}
h3{font-size:1.15rem;font-weight:600}
p{margin:0 0 1em;max-width:70ch}
a{color:inherit}
img{max-width:100%;display:block}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 20px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* ---- top bar ---- */
header.site{background:var(--board);color:var(--silk);border-bottom:2px solid var(--gold)}
.bar{display:flex;align-items:center;gap:18px;min-height:64px;flex-wrap:wrap;padding:8px 20px;max-width:var(--wrap);margin:0 auto}
.brand{font-family:Archivo;font-weight:800;font-size:1.15rem;letter-spacing:-.02em;text-decoration:none;display:flex;align-items:center;gap:10px}
.brand .pad{width:14px;height:14px;background:var(--gold);border-radius:2px;box-shadow:0 0 0 3px rgba(201,162,39,.25)}
nav.main{display:flex;gap:2px;flex-wrap:wrap;margin-left:auto;align-items:center}
nav.main a{padding:8px 12px;text-decoration:none;font-size:.94rem;font-weight:500;border-radius:var(--radius);opacity:.86}
nav.main a:hover{opacity:1;background:rgba(255,255,255,.09)}
nav.main a.on{opacity:1;background:var(--gold);color:#241d00;font-weight:600}
.cartbtn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);color:var(--silk);padding:8px 13px;border-radius:var(--radius);cursor:pointer;font-weight:600;font-size:.9rem}
.adminstrip{background:var(--gold);color:#241d00;font-weight:600;font-size:.86rem}
.adminstrip .wrap{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding-top:7px;padding-bottom:7px}
.adminstrip button{background:#241d00;color:#fff;border:0;padding:5px 11px;border-radius:var(--radius);cursor:pointer;font-size:.82rem;font-weight:600}

/* ---- hero ---- */
.hero{background:var(--board-2);color:var(--silk);
  background-image:linear-gradient(90deg,rgba(201,162,39,.16) 1px,transparent 1px),linear-gradient(rgba(201,162,39,.16) 1px,transparent 1px);
  background-size:52px 52px;}
.hero .wrap{padding:64px 20px 56px;display:grid;grid-template-columns:1.35fr .9fr;gap:40px;align-items:end}
.hero h1{color:var(--silk);max-width:14ch}
.hero p{color:#C7D6CE;font-size:1.06rem;max-width:44ch}
.specsheet{border:1px solid rgba(201,162,39,.5);background:rgba(0,0,0,.25)}
.specsheet div{display:flex;justify-content:space-between;gap:16px;padding:10px 14px;border-bottom:1px dashed rgba(201,162,39,.3);font-size:.92rem}
.specsheet div:last-child{border-bottom:0}
.specsheet span:first-child{color:#A9BDB2}
.specsheet span:last-child{font-weight:600;color:var(--gold)}

/* ---- layout bits ---- */
main{min-height:58vh;padding:44px 0 72px}
.pagehead{border-bottom:2px solid var(--board);padding-bottom:14px;margin-bottom:28px;display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}
.pagehead p{margin:6px 0 0;color:var(--ink-2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.card{background:var(--panel);padding:18px;display:flex;flex-direction:column;gap:8px}
.card .thumb{aspect-ratio:4/3;background:var(--paper);border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;color:var(--ink-2);font-size:.8rem;overflow:hidden}
.card .thumb img{width:100%;height:100%;object-fit:cover}
.price{font-family:Archivo;font-weight:800;font-size:1.3rem;color:var(--board)}
:root[data-theme="dark"] .price,:root:not([data-theme="light"]) .price{color:var(--gold)}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .price{color:var(--board)}}
.tag{display:inline-block;font-size:.72rem;font-weight:600;padding:2px 7px;border:1px solid var(--gold);color:var(--gold-2);border-radius:99px}
.muted{color:var(--ink-2)}
.empty{border:1px dashed var(--line);padding:44px 24px;text-align:center;color:var(--ink-2);background:var(--panel)}
.empty strong{display:block;color:var(--ink);font-family:Archivo;font-size:1.2rem;margin-bottom:6px}

.btn{display:inline-block;background:var(--board);color:#fff;border:0;padding:11px 18px;border-radius:var(--radius);font-weight:600;cursor:pointer;text-decoration:none;font-size:.95rem}
.btn:hover{background:var(--board-2)}
.btn.gold{background:var(--gold);color:#241d00}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--alert)}
.btn.sm{padding:6px 11px;font-size:.84rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

label{display:block;font-size:.85rem;font-weight:600;margin-bottom:4px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel)}
textarea{min-height:90px;resize:vertical}
.field{margin-bottom:14px}
.fields2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
form.panel,.panel{background:var(--panel);border:1px solid var(--line);padding:22px}

table{width:100%;border-collapse:collapse;background:var(--panel)}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);font-size:.93rem;vertical-align:top}
th{font-family:Archivo;font-size:.8rem;color:var(--ink-2)}

.steps{display:grid;gap:1px;background:var(--line);border:1px solid var(--line)}
.step{background:var(--panel);padding:20px}
.step h3{display:flex;align-items:center;gap:10px}
.step h3 .n{width:26px;height:26px;background:var(--board);color:var(--gold);display:grid;place-items:center;font-size:.85rem;border-radius:2px;flex:none}
.pick{display:flex;justify-content:space-between;gap:14px;align-items:center;border:1px solid var(--line);padding:12px;margin-bottom:8px;background:var(--panel)}
.pick.sel{border-color:var(--gold);box-shadow:inset 3px 0 0 var(--gold)}
.pick small{color:var(--ink-2);display:block}
.fit{font-size:.74rem;font-weight:600;color:var(--ok)}
.nofit{font-size:.74rem;font-weight:600;color:var(--alert)}

.summary{position:sticky;top:16px}
.lineitem{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:.93rem}
.total{display:flex;justify-content:space-between;font-family:Archivo;font-weight:800;font-size:1.25rem;padding-top:12px}

.split{display:grid;grid-template-columns:1.6fr .9fr;gap:28px;align-items:start}
.notice{border-left:4px solid var(--gold);background:var(--panel);padding:14px 16px;font-size:.9rem;margin-bottom:18px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--board);color:#fff;padding:12px 20px;border-radius:var(--radius);z-index:99;box-shadow:0 6px 24px rgba(0,0,0,.3)}
dialog{border:1px solid var(--line);border-radius:var(--radius);padding:0;max-width:420px;width:92%;background:var(--panel);color:var(--ink)}
dialog::backdrop{background:rgba(8,42,32,.6)}
.dlg{padding:24px}
footer.site{background:var(--board);color:#B9CCC2;padding:34px 0;font-size:.9rem}
footer.site a{color:var(--gold)}
.scroll{overflow-x:auto}
@media (max-width:820px){
  .hero .wrap{grid-template-columns:1fr;padding:44px 20px}
  .split{grid-template-columns:1fr}
  .fields2{grid-template-columns:1fr}
  .summary{position:static}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>
/* =====================================================================
   SHARED STORAGE SETUP — saves straight into a JSON file in your GitHub
   repo, so all devices read the same catalog. Read the note further
   down before putting a token in here — it explains a real risk.

   1. In your GitHub repo (the one this file lives in), add a file
      called data.json at the repo root containing just: {}
   2. Fill in GITHUB_OWNER, GITHUB_REPO and GITHUB_BRANCH below to match
      your repo (branch is usually "main"). GITHUB_DATA_PATH should
      match the file you made in step 1 ("data.json" if you kept that
      name).
   3. Everyone's browser (customers included) reads data.json straight
      from GitHub — no token needed for that, and it works immediately.
   4. To WRITE (add parts, edit settings, etc.) the site needs a GitHub
      token with permission to push to this one repo. Create one at
      https://github.com/settings/personal-access-tokens/new — under
      "Repository access" choose "Only select repositories" and pick
      this repo, then under "Permissions" set Contents to
      "Read and write". Copy the token (starts with github_pat_).
   5. Sign in as owner on this site, go to Site settings, and paste the
      token into "GitHub write token." It's saved only in that one
      browser's local storage — never written into data.json, never
      synced anywhere — so you'll need to paste it again on any other
      device you want to make edits from.

   IMPORTANT — read this before making a token:
   Anyone who has that token could push commits to this repo as you,
   not just edit the shop's data — a leaked token is a bigger problem
   than a leaked site password. Scoping it to just this one repo (step
   4) limits the damage, but it's still a real credential. Keep it out
   of screenshots, don't paste it into chat, and if you ever suspect
   it leaked, delete it from that GitHub settings page immediately —
   that instantly revokes it, and you can make a new one any time.
   ===================================================================== */
const GITHUB_OWNER = "bfung2";
const GITHUB_REPO = "bfung2.github.io";
const GITHUB_BRANCH = "main";
const GITHUB_DATA_PATH = "data.json";
const ghConfigured = GITHUB_OWNER !== "YOUR_GITHUB_USERNAME" && GITHUB_REPO !== "YOUR_REPO_NAME";
function ghToken(){ try{ return localStorage.getItem("apex.ghtoken")||""; }catch(e){ return ""; } }
function setGhToken(t){ try{ if(t) localStorage.setItem("apex.ghtoken", t); else localStorage.removeItem("apex.ghtoken"); }catch(e){} }

/* Owner sign-in is username + password + a separate code, all three checked
   against the values below. Change any of them any time — anyone who can view
   page source can read them, so this is a lock on the edit screens for casual
   visitors, not a defense against someone with access to this file. */
const OWNER_USERNAME = "BradynK";
const OWNER_PASSWORD = "Ainsfdap0-341209LKlknfd)94nkkladsklKfoidnbgrmjJ26398fnfl8j";
const OWNER_CODE = "0619445";

/* ---------- storage ---------- */
const KEY = "apexcomputers.v1";  // old local-only key, read once below to migrate
const DEFAULTS = {
  settings:{
    shopName:"Apex Computers",
    tagline:"Custom PCs, parts and on-site tech help.",
    ownerEmail:"",
    phone:"",
    address:"",
    buildFee:250,
    taxRate:0,
    aboutText:"",
    contactText:"",
    ownerPhone:"",
    zelleInfo:"",
    paypalLink:"",
    applePayInfo:""
  },
  products:[], parts:[], orders:[], requests:[], accounts:[]
};
let S = structuredClone(DEFAULTS);
let myCart = [];                 // NOT shared — each browser keeps its own
let cloudConnected = false;
let cloudConfigured = ghConfigured;
let cloudError = "";
let fileSha = null;            // GitHub needs the current file's sha to write

function mergeIntoDefaults(d){
  const s = Object.assign({}, DEFAULTS.settings, (d&&d.settings)||{});
  if(s.shopName === "Bench & Board") s.shopName = "Apex Computers";
  delete s.ownerUsername; delete s.ownerPasswordHash;
  return Object.assign(structuredClone(DEFAULTS), d||{}, {settings:s});
}
function loadLocalFallback(){
  try{
    const raw = localStorage.getItem(KEY);
    if(!raw) return null;
    return mergeIntoDefaults(JSON.parse(raw));
  }catch(e){ return null; }
}
function loadCart(){ try{ myCart = JSON.parse(sessionStorage.getItem("apex.cart")||"[]"); }catch(e){ myCart = []; } }
function saveCart(){ try{ sessionStorage.setItem("apex.cart", JSON.stringify(myCart)); }catch(e){} }

async function fetchRemoteData(){
  const url = `https://raw.githubusercontent.com/${GITHUB_OWNER}/${GITHUB_REPO}/${GITHUB_BRANCH}/${GITHUB_DATA_PATH}?_=${Date.now()}`;
  const res = await fetch(url, {cache:"no-store"});
  if(!res.ok) throw new Error(`GitHub returned ${res.status} fetching ${GITHUB_DATA_PATH} — does that file exist in the repo yet?`);
  const text = await res.text();
  return text.trim() ? JSON.parse(text) : {};
}
async function startCloudSync(){
  loadCart();
  if(!ghConfigured){
    S = loadLocalFallback() || structuredClone(DEFAULTS);
    toast("No shared file configured yet — parts you add here will only show on this device.");
    render();
    return;
  }
  try{
    const d = await fetchRemoteData();
    S = mergeIntoDefaults(d);
    cloudConnected = true; cloudError = "";
  }catch(err){
    console.error(err);
    S = loadLocalFallback() || structuredClone(DEFAULTS);
    cloudConnected = false; cloudError = err.message||String(err);
  }
  render();
  // Poll for changes made from other devices — GitHub has no live push,
  // so this is how another device's edits show up here without a manual reload.
  setInterval(async ()=>{
    if(!ghConfigured) return;
    try{
      const d = await fetchRemoteData();
      S = mergeIntoDefaults(d);
      cloudConnected = true; cloudError = "";
    }catch(err){ cloudConnected = false; cloudError = err.message||String(err); }
    render();
  }, 20000);
}
let saveTimer = null;
function save(){
  if(!ghConfigured){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} return; }
  clearTimeout(saveTimer);
  saveTimer = setTimeout(pushToGithub, 600);
}
async function pushToGithub(){
  const token = ghToken();
  if(!token){
    cloudError = "No GitHub write token saved on this device — add one in Site settings to save changes.";
    cloudConnected = false; toast(cloudError); render();
    return;
  }
  const apiUrl = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${GITHUB_DATA_PATH}`;
  try{
    if(!fileSha){
      const cur = await fetch(apiUrl+`?ref=${GITHUB_BRANCH}`, {headers:{Authorization:`Bearer ${token}`, Accept:"application/vnd.github+json"}});
      if(cur.ok){ const j = await cur.json(); fileSha = j.sha; }
    }
    const body = {
      message: "Update site data — "+new Date().toISOString(),
      content: btoa(unescape(encodeURIComponent(JSON.stringify(S,null,2)))),
      branch: GITHUB_BRANCH
    };
    if(fileSha) body.sha = fileSha;
    const res = await fetch(apiUrl, {
      method:"PUT",
      headers:{Authorization:`Bearer ${token}`, Accept:"application/vnd.github+json", "Content-Type":"application/json"},
      body: JSON.stringify(body)
    });
    if(!res.ok){
      const j = await res.json().catch(()=>({}));
      if(res.status===409){ fileSha=null; return pushToGithub(); } // someone else saved first — refetch sha, retry once
      throw new Error(j.message || `GitHub returned ${res.status}`);
    }
    const j = await res.json();
    fileSha = j.content && j.content.sha;
    cloudConnected = true; cloudError = "";
  }catch(err){
    console.error(err);
    cloudConnected = false; cloudError = err.message||String(err);
    toast("Couldn't save to GitHub — see the banner for details.");
  }
  render();
}
function uid(){ return Math.random().toString(36).slice(2,9); }
const money = n => "$" + (Math.round((+n||0)*100)/100).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- session ---------- */
let isOwner = sessionStorage.getItem("apex.owner")==="1";
let me = null;
try{ me = JSON.parse(localStorage.getItem("apex.customer")||"null"); }catch(e){}

let loginStep = "password";   // "password" -> "confirm" -> signed in
let pendingCode = null;

function tryLogin(e){
  e && e.preventDefault();
  if(lu.value.trim() === OWNER_USERNAME && pw.value === OWNER_PASSWORD && lc.value.trim() === OWNER_CODE){
    if(S.settings.ownerPhone){
      pendingCode = String(Math.floor(100000+Math.random()*900000));
      loginStep = "confirm";
      render();
    } else {
      isOwner = true; sessionStorage.setItem("apex.owner","1");
      go('/manage'); toast("Signed in as owner.");
    }
  } else { pwErr.textContent = "Username, password or code doesn't match."; pw.value=""; lc.value=""; pw.focus(); }
}
function sendConfirmText(){
  if(!S.settings.ownerPhone){ toast("Add your phone number in settings first — see the note on this screen."); return; }
  const body = `Apex Computers sign-in code: ${pendingCode}`;
  location.href = `sms:${encodeURIComponent(S.settings.ownerPhone)}${/iPhone|iPad|iPod/.test(navigator.userAgent)?"&":"?"}body=${encodeURIComponent(body)}`;
}
function confirmLogin(e){
  e.preventDefault();
  if(cc.value.trim() === pendingCode){
    isOwner = true; sessionStorage.setItem("apex.owner","1");
    loginStep = "password"; pendingCode = null;
    go('/manage'); toast("Signed in as owner.");
  } else { ccErr.textContent = "That code doesn't match what was sent."; }
}
function logout(){ isOwner=false; sessionStorage.removeItem("apex.owner"); loginStep="password"; pendingCode=null; go('/'); toast("Signed out of owner mode."); }

function combineAddress(a){
  a = a || {};
  const line2 = [a.city, a.state].filter(Boolean).join(", ");
  return [a.street, [line2, a.zip].filter(Boolean).join(" ")].filter(Boolean).join(", ");
}
function customerLogin(e){
  e.preventDefault();
  const rec = {name:ac_name.value.trim(), email:ac_email.value.trim().toLowerCase(),
    phone:ac_phone.value.trim(), address:{street:ac_street.value.trim(),city:ac_city.value.trim(),state:ac_state.value.trim(),zip:ac_zip.value.trim()}};
  if(!rec.email){ toast("An email is needed."); return; }
  const known = (S.accounts||[]).find(a=>a.email===rec.email);
  if(known) Object.assign(known, {name:rec.name||known.name, phone:rec.phone||known.phone, address:(rec.address.street?rec.address:known.address)});
  else (S.accounts = S.accounts||[]).push(rec);
  me = known || rec;
  try{ localStorage.setItem("apex.customer", JSON.stringify(me)); }catch(err){}
  save(); go(myCart.length ? '/checkout' : '/account'); toast("Welcome, "+(me.name||me.email)+".");
}
function customerLogout(){ me=null; try{ localStorage.removeItem("apex.customer"); }catch(e){} go('/'); toast("Signed out."); }
function myOrders(){ return me ? S.orders.filter(o=>(o.email||"").toLowerCase()===me.email) : []; }

/* ---------- router ---------- */
const PAGES = [["/","Home"],["/products","Products"],["/build","Build a PC"],["/tech","Request a tech"],["/about","About"],["/contact","Contact"]];
function go(p){ location.hash = "#"+p; }
function route(){ return (location.hash||"#/").slice(1).split("?")[0] || "/"; }
addEventListener("hashchange", ()=>{ render(); scrollTo({top:0}); });

/* ---------- part categories & compatibility ---------- */
const CATS = ["CPU","Motherboard","Memory","Graphics card","Storage","Power supply","Case","CPU cooler","Other"];
const SOCKETS = ["AM5","AM4","LGA1851","LGA1700","LGA1200","Other"];

function fitsCPU(part, cpu, need){
  if(!cpu) return true;
  switch(part.category){
    case "Motherboard": return !part.socket || part.socket===cpu.socket;
    case "Memory":      return !part.memType || !cpu.memType || part.memType===cpu.memType;
    case "CPU cooler":  return !part.socket || part.socket===cpu.socket;
    case "Power supply":return (+part.watts||0) === 0 || (+part.watts||0) >= need;
    default: return true;
  }
}
/* Sums the CPU's own TDP plus the power-draw field on every other selected
   part (graphics card mainly) to get the watts the build actually needs —
   then only power supplies rated at or above that number are shown as fits. */
function requiredWatts(cpu, chosenExcludingPSU){
  const cpuW = cpu ? (+cpu.tdp||0) : 0;
  const restW = chosenExcludingPSU.reduce((n,p)=>n+(+p.power||0),0);
  return cpuW + restW;
}

/* ---------- cart ---------- */
function cartCount(){ return myCart.reduce((n,i)=>n+(i.qty||1),0); }
function addToCart(item){ myCart.push(item); saveCart(); render(); toast("Added to cart."); }
function removeCart(i){ myCart.splice(i,1); saveCart(); render(); }
function cartTotals(){
  let sub = 0;
  myCart.forEach(i => sub += (+i.price||0)*(i.qty||1));
  const tax = sub * ((+S.settings.taxRate||0)/100);
  return {sub, tax, total: sub+tax};
}

/* ---------- render ---------- */
function render(){
  document.querySelector("#brandName span:last-child").textContent = S.settings.shopName || "Apex Computers";
  document.title = (S.settings.shopName||"Apex Computers") + " — Custom PCs, Parts & Tech Service";
  nav.innerHTML = PAGES.map(([p,t])=>`<a href="#${p}" class="${route()===p?'on':''}">${t}</a>`).join("");
  cartBtn.textContent = `Cart (${cartCount()})`;
  accBtn.textContent = me ? (me.name ? me.name.split(" ")[0] : "Account") : "Sign in";
  accBtn.onclick = () => go(me ? '/account' : '/login');
  adminStrip.hidden = !isOwner;
  if(isOwner){
    cloudStatus.textContent = !cloudConfigured ? "⚠ No shared database — this device only"
      : cloudConnected ? "● Synced across devices"
      : "⚠ Not connected"+(cloudError?" — "+cloudError:"");
    cloudStatus.style.color = (cloudConfigured && cloudConnected) ? "#8fd9b6" : "#ffd27a";
  }
  ownerLink.textContent = isOwner ? "Owner mode is on" : "Owner sign-in";
  footInfo.innerHTML = [
    `<strong>${esc(S.settings.shopName||"Apex Computers")}</strong>`,
    S.settings.address ? esc(S.settings.address) : "",
    S.settings.phone ? esc(S.settings.phone) : "",
    S.settings.ownerEmail ? esc(S.settings.ownerEmail) : ""
  ].filter(Boolean).join(" &nbsp;·&nbsp; ");

  const r = route();
  const views = {"/":home,"/products":products,"/build":build,"/tech":tech,"/about":about,
    "/contact":contact,"/cart":cart,"/checkout":checkout,"/login":login,"/account":account,
    "/staff":staff,"/owner":staff,"/manage":manage,"/inbox":inbox,"/done":done};
  app.innerHTML = (views[r]||home)();
  if(typeof AFTER === "function"){ const f = AFTER; AFTER=null; f(); }
}

/* ---- build page ---- */
let buildSel = {}; let wantAssembly = false;
function build(){
  const cpus = S.parts.filter(p=>p.category==="CPU");
  const cpu = buildSel["CPU"] ? S.parts.find(p=>p.id===buildSel["CPU"]) : null;
  const chosenExcludingPSU = Object.entries(buildSel)
    .filter(([cat])=>cat!=="CPU" && cat!=="Power supply")
    .map(([,id])=>S.parts.find(p=>p.id===id)).filter(Boolean);
  const need = requiredWatts(cpu, chosenExcludingPSU);
  const sections = CATS.filter(c=>c!=="CPU").map((cat,idx)=>{
    const all = S.parts.filter(p=>p.category===cat);
    if(!all.length) return "";
    const good = all.filter(p=>fitsCPU(p,cpu,need)), bad = all.filter(p=>!fitsCPU(p,cpu,need));
    return `<div class="step"><h3><span class="n">${idx+2}</span>${cat}</h3>
      ${cpu?`<p class="muted" style="font-size:.86rem">Recommended for your ${esc(cpu.name)}${cat==="Power supply"?` — needs ${need}W or more based on the parts picked so far`:""}${(cat==="Motherboard"||cat==="CPU cooler")&&cpu.socket?` — socket ${esc(cpu.socket)}`:""}${cat==="Memory"&&cpu.memType?` — ${esc(cpu.memType)}`:""}</p>`:""}
      ${good.map(p=>pickRow(p,cat,true)).join("") || `<p class="muted">Nothing in this category fits that CPU yet.</p>`}
      ${bad.length?`<details style="margin-top:10px"><summary class="muted" style="cursor:pointer;font-size:.88rem">Show ${bad.length} that may not fit</summary><div style="margin-top:10px">${bad.map(p=>pickRow(p,cat,false)).join("")}</div></details>`:""}
      ${isOwner?`<button class="btn sm ghost" onclick="editPart(null,'${cat}')">Add ${esc(cat.toLowerCase())}</button>`:""}
    </div>`;
  }).join("");

  const chosen = Object.values(buildSel).map(id=>S.parts.find(p=>p.id===id)).filter(Boolean);
  const sub = chosen.reduce((n,p)=>n+(+p.price||0),0) + (wantAssembly ? (+S.settings.buildFee||0) : 0);

  return `<div class="wrap">
    <div class="pagehead"><div><h2>Build a PC</h2><p>Choose a processor first — the rest of the list narrows to parts that match its socket, memory type and power draw.</p></div>
    ${isOwner?`<button class="btn gold" onclick="editPart()">Add a part</button>`:""}</div>
    ${!S.parts.length?`<div class="empty"><strong>No parts uploaded yet</strong>${isOwner?"Add a CPU first, then boards, memory and the rest. Fill in socket and memory type so the matching works.":"Parts are being added. Check back shortly."}</div>`:`
    <div class="split">
      <div class="steps">
        <div class="step"><h3><span class="n">1</span>Processor</h3>
          ${cpus.length?cpus.map(p=>pickRow(p,"CPU",true)).join(""):`<p class="muted">No CPUs listed yet.</p>`}
          ${isOwner?`<button class="btn sm ghost" onclick="editPart(null,'CPU')">Add CPU</button>`:""}
        </div>
        ${sections}
      </div>
      <div class="summary panel">
        <h3>Your build</h3>
        ${chosen.length?chosen.map(p=>`<div class="lineitem"><span>${esc(p.name)}<br><small class="muted">${esc(p.category)}</small></span><span>${money(p.price)}</span></div>`).join(""):`<p class="muted">Nothing picked yet.</p>`}
        <label style="display:flex;gap:10px;align-items:flex-start;margin:16px 0;font-weight:500">
          <input type="checkbox" style="width:auto;margin-top:4px" ${wantAssembly?"checked":""} onchange="wantAssembly=this.checked;render()">
          <span>Have us assemble and test it — <strong>${money(S.settings.buildFee)}</strong><br><small class="muted">Leave unchecked and the parts ship loose for you to build.</small></span>
        </label>
        <div class="total"><span>Subtotal</span><span>${money(sub)}</span></div>
        <button class="btn gold" style="width:100%;margin-top:14px" ${chosen.length?"":"disabled"} onclick="addBuildToCart()">Add build to cart</button>
      </div>
    </div>`}
  </div>`;
}
function pickRow(p,cat,ok){
  const sel = buildSel[cat]===p.id;
  const spec = [p.socket,p.memType,p.watts?p.watts+"W output":"",p.tdp?p.tdp+"W TDP":"",p.power?p.power+"W draw":""].filter(Boolean).join(" · ");
  return `<div class="pick ${sel?'sel':''}">
    <div><strong>${esc(p.name)}</strong> <span class="${ok?'fit':'nofit'}">${ok?'fits':'check fit'}</span>
      <small>${esc(p.desc||"")}${spec?` — ${esc(spec)}`:""}</small></div>
    <div class="row" style="flex:none">
      <span class="price" style="font-size:1rem">${money(p.price)}</span>
      <button class="btn sm ${sel?'ghost':''}" onclick="pickPart('${cat}','${p.id}')">${sel?"Remove":"Choose"}</button>
      ${isOwner?`<button class="btn sm ghost" onclick="editPart('${p.id}')">Edit</button><button class="btn sm danger" onclick="delPart('${p.id}')">×</button>`:""}
    </div></div>`;
}
function pickPart(cat,id){ if(buildSel[cat]===id) delete buildSel[cat]; else buildSel[cat]=id; render(); }
function addBuildToCart(){
  const chosen = Object.values(buildSel).map(id=>S.parts.find(p=>p.id===id)).filter(Boolean);
  if(!chosen.length) return;
  const price = chosen.reduce((n,p)=>n+(+p.price||0),0) + (wantAssembly?(+S.settings.buildFee||0):0);
  addToCart({id:uid(),kind:"build",qty:1,name:"Custom PC build"+(wantAssembly?" (assembled by us)":" (parts only)"),price,
    parts:chosen.map(p=>({name:p.name,category:p.category,price:+p.price||0})), assembly:wantAssembly, fee:wantAssembly?(+S.settings.buildFee||0):0});
  buildSel={}; wantAssembly=false;
}

function submitRequest(e){
  e.preventDefault();
  const r = {id:uid(),at:new Date().toISOString(),name:rn.value,email:re.value,phone:rp.value,when:rw.value,address:ra.value,device:rd.value,issue:ri.value};
  S.requests.unshift(r); save();
  const body = `New tech request\n\nName: ${r.name}\nEmail: ${r.email}\nPhone: ${r.phone}\nAddress: ${r.address}\nAvailability: ${r.when}\nDevice: ${r.device}\n\nIssue:\n${r.issue}\n`;
  mailOwner("Tech request — "+r.name, body);
  e.target.reset(); toast("Request saved. Your email app should open now.");

function looksLikeAddress(a){
  a = a || {};
  const street=(a.street||"").trim(), city=(a.city||"").trim(), state=(a.state||"").trim(), zip=(a.zip||"").trim();
  return /\d/.test(street) && street.length>=5 && city.length>=2 && state.length>=2 && /^\d{5}(-\d{4})?$/.test(zip);
}
function currentCheckoutAddress(){
  return {street:c_street.value.trim(), city:c_city.value.trim(), state:c_state.value.trim(), zip:c_zip.value.trim()};
}
function checkAddress(){
  addrWarn.hidden = looksLikeAddress(currentCheckoutAddress());
}
function checkout(){
  const t = cartTotals();
  const a = (me&&me.address)||{};
  if(!myCart.length){ return `<div class="wrap"><div class="empty"><strong>Your cart is empty</strong></div></div>`; }
  return `<div class="wrap"><div class="pagehead"><div><h2>Checkout</h2><p>This sends your order to us — nothing is charged here. We'll email you an invoice to pay by Zelle, PayPal or Apple Pay.</p></div></div>
  <div class="split">
    <form class="panel" onsubmit="return submitOrder(event)">
      <div class="fields2">
        <div class="field"><label for="cn">Full name</label><input id="cn" required value="${esc(me?me.name:"")}"></div>
        <div class="field"><label for="ce">Email</label><input id="ce" type="email" required value="${esc(me?me.email:"")}"></div>
        <div class="field"><label for="cp">Phone</label><input id="cp" value="${esc(me?me.phone:"")}"></div>
        <div></div>
      </div>
      <div class="field"><label for="c_street">Street address</label><input id="c_street" required oninput="checkAddress()" value="${esc(a.street)}"></div>
      <div class="fields2">
        <div class="field"><label for="c_city">City</label><input id="c_city" required oninput="checkAddress()" value="${esc(a.city)}"></div>
        <div class="field"><label for="c_state">State</label><input id="c_state" required oninput="checkAddress()" value="${esc(a.state)}"></div>
      </div>
      <div class="field" style="max-width:160px"><label for="c_zip">ZIP</label><input id="c_zip" required oninput="checkAddress()" value="${esc(a.zip)}"></div>
      <p id="addrWarn" ${looksLikeAddress(a)?"hidden":""} class="muted" style="font-size:.82rem;color:var(--alert);margin:6px 0 14px">This doesn't look complete yet — a street number, city, state and 5-digit ZIP are needed so the invoice reaches the right place.</p>
      ${me?"":`<div class="notice" style="margin-bottom:14px">Have an account? <a href="#/login">Sign in</a> and these fields fill themselves in.</div>`}
      <div class="field"><label for="cnote">Anything else we should know</label><textarea id="cnote" style="min-height:60px"></textarea></div>
      <div class="notice">We don't take card numbers on this site. After you submit, we'll follow up by email with an itemized invoice you can pay by Zelle, PayPal or Apple Pay.</div>
      <button class="btn gold" type="submit">Submit order</button>
    </form>
    <div class="summary panel">
      ${myCart.map(i=>`<div class="lineitem"><span>${esc(i.name)}</span><span>${money(i.price)}</span></div>`).join("")}
      ${t.tax?`<div class="lineitem"><span>Tax</span><span>${money(t.tax)}</span></div>`:""}
      <div class="total"><span>Total</span><span>${money(t.total)}</span></div>
    </div></div></div>`;
}
function orderText(o){
  return `New order request ${o.ref}\n${new Date(o.at).toLocaleString()}\n\n`+
  `CUSTOMER\nName: ${o.name}\nEmail: ${o.email}\nPhone: ${o.phone}\nAddress: ${o.address}\n\n`+
  `ITEMS & SERVICES\n`+o.items.map(i=>`- ${i.name} — ${money(i.price)}`+(i.parts?`\n`+i.parts.map(p=>`    · ${p.category}: ${p.name} (${money(p.price)})`).join("\n")+(i.assembly?`\n    · Assembly service: ${money(i.fee)}`:""):"")).join("\n")+
  `\n\nTOTAL DUE: ${money(o.total)}\n\nCustomer notes: ${o.notes||"—"}\n\n`+
  `Next step: send ${o.name} an invoice for ${money(o.total)} by Zelle, PayPal or Apple Pay.`;
}
function invoiceText(o){
  const s = S.settings;
  const pay = [
    s.zelleInfo?`Zelle: ${s.zelleInfo}`:"",
    s.paypalLink?`PayPal: ${s.paypalLink}`:"",
    s.applePayInfo?`Apple Pay: ${s.applePayInfo}`:""
  ].filter(Boolean).join("\n") || "(add your Zelle / PayPal / Apple Pay info in Site settings)";
  return `Hi ${o.name},\n\nHere's your invoice for order ${o.ref}:\n\n`+
  o.items.map(i=>`- ${i.name} — ${money(i.price)}`).join("\n")+
  `\n\nTotal due: ${money(o.total)}\n\nYou can pay with any of these:\n${pay}\n\n`+
  `Once payment goes through, reply here or text us and we'll get started.\n\nThanks,\n${s.shopName||"Apex Computers"}`;
}
function submitOrder(e){
  e.preventDefault();
  const addr = currentCheckoutAddress();
  if(!looksLikeAddress(addr)){ addrWarn.hidden = false; c_street.focus(); return false; }
  const t = cartTotals();
  const o = {id:uid(),ref:"AC-"+Date.now().toString(36).toUpperCase(),at:new Date().toISOString(),
    name:cn.value,email:ce.value,phone:cp.value,address:combineAddress(addr),notes:cnote.value,
    items:structuredClone(myCart),total:t.total,status:"requested"};
  S.orders.unshift(o); myCart=[]; saveCart(); save();
  lastOrder = o;
  mailOwner(`Order request ${o.ref} — ${o.name}`, orderText(o));
  go('/done');
  return false;
}
let lastOrder = null;
function done(){
  if(!lastOrder) return `<div class="wrap"><div class="empty"><strong>Nothing to show</strong></div></div>`;
  const o = lastOrder;
  return `<div class="wrap"><div class="pagehead"><div><h2>Order ${esc(o.ref)} submitted</h2>
  <p>An email with the full order should have opened in your mail app — send it so we see it. We'll reply with an invoice.</p></div></div>
  <div class="panel"><pre style="white-space:pre-wrap;font-size:.88rem;margin:0">${esc(orderText(o))}</pre></div>
  <div class="row" style="margin-top:16px">
    <button class="btn" onclick="mailOwner('Order request ${esc(o.ref)}', orderText(lastOrder))">Re-open the email</button>
    <a class="btn ghost" href="#/">Back to the shop</a>
  </div></div>`;
}
function copyText(str){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(str).catch(()=>{});
  }
}
function mailOwner(subject, body){
  const to = S.settings.ownerEmail;
  if(!to){ toast("No shop email set yet — the order was still saved."); return; }
  copyText(body);
  const url = `mailto:${encodeURIComponent(to)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
  const a = document.createElement("a"); a.href = url; a.rel="noopener"; document.body.appendChild(a); a.click(); a.remove();
  toast("Opening your email app — if nothing appears, the message is on your clipboard to paste in.");
}

  if(!me){ go('/login'); return ""; }

  return `<div class="wrap" style="max-width:820px">
    <div class="pagehead"><div><h2>${esc(me.name||me.email)}</h2><p>${esc(me.email)}</p></div>

    <div class="panel" style="margin-bottom:22px"><h3>Your details</h3>
      <p class="muted" style="font-size:.92rem">${esc(me.phone||"No phone saved")}<br>${esc(combineAddress(me.address))||"No address saved"}</p>
      <button class="btn sm ghost" onclick="customerLogout()">Change details</button></div>
    <h3>Your orders</h3>
    ${mine.length?`<div class="scroll"><table><tr><th>Ref</th><th>Date</th><th>Items</th><th>Total</th></tr>

    return `<div class="wrap" style="max-width:480px">
      <div class="pagehead"><div><h2>Confirm it's you</h2><p>Credentials correct. Text yourself the code below, then enter it here.</p></div></div>

        </div>
        <form onsubmit="confirmLogin(event)">

          <div class="row"><button class="btn gold" type="submit">Confirm sign-in</button>
          <button class="btn ghost" type="button" onclick="loginStep='password';render()">Back</button></div>

function manage(){
  if(!isOwner) return staff();
  const s = S.settings;
  return `<div class="wrap"><div class="pagehead"><div><h2>Site settings</h2><p>Everything here shows on the public site. No code editing needed.</p></div></div>
  <div class="notice" style="margin-bottom:22px">${ghConfigured?(cloudConnected?"Connected — reading and writing data.json in your GitHub repo, so every device stays in sync.":`Not connected${cloudError?": "+esc(cloudError):" yet"}. Check that data.json exists in the repo, and that GITHUB_OWNER/GITHUB_REPO/GITHUB_BRANCH in the file match it exactly.`):"No shared file configured — see the setup note at the top of the HTML file (look for GITHUB_OWNER). Until then, changes here only show on this device."}</div>
  <div class="panel" style="margin-bottom:22px"><h3>Connection check</h3>
    <table>
      <tr><th>GITHUB_OWNER</th><td>${esc(GITHUB_OWNER)}${GITHUB_OWNER==="YOUR_GITHUB_USERNAME"?` <span style="color:var(--alert)">— still the placeholder</span>`:""}</td></tr>
      <tr><th>GITHUB_REPO</th><td>${esc(GITHUB_REPO)}${GITHUB_REPO==="YOUR_REPO_NAME"?` <span style="color:var(--alert)">— still the placeholder</span>`:""}</td></tr>
      <tr><th>GITHUB_BRANCH</th><td>${esc(GITHUB_BRANCH)}</td></tr>
      <tr><th>File it reads</th><td><a href="https://raw.githubusercontent.com/${esc(GITHUB_OWNER)}/${esc(GITHUB_REPO)}/${esc(GITHUB_BRANCH)}/${esc(GITHUB_DATA_PATH)}" target="_blank" rel="noopener">raw.githubusercontent.com/${esc(GITHUB_OWNER)}/${esc(GITHUB_REPO)}/${esc(GITHUB_BRANCH)}/${esc(GITHUB_DATA_PATH)}</a> — open this link directly; it should show your actual data as text, not a 404 page.</td></tr>
      <tr><th>Write token on this device</th><td>${ghToken()?"Saved on this device":`<span style="color:var(--alert)">Not saved — reading works, but nothing you add here will reach GitHub until you paste a token in below</span>`}</td></tr>
      <tr><th>Last write result</th><td>${cloudError?esc(cloudError):(cloudConnected?"OK":"—")}</td></tr>
    </table>
  </div>
  <form class="panel" onsubmit="saveSettings(event)">
    <div class="fields2">
      <div class="field"><label for="s_shop">Shop name</label><input id="s_shop" value="${esc(s.shopName)}"></div>
      <div class="field"><label for="s_tag">Tagline</label><input id="s_tag" value="${esc(s.tagline)}"></div>
      <div class="field"><label for="s_mail">Email orders and requests to</label><input id="s_mail" type="email" value="${esc(s.ownerEmail)}"></div>
      <div class="field"><label for="s_phone">Phone</label><input id="s_phone" value="${esc(s.phone)}"></div>
      <div class="field"><label for="s_fee">Assembly fee ($)</label><input id="s_fee" type="number" step="1" value="${+s.buildFee||0}"></div>
      <div class="field"><label for="s_tax">Tax rate (%)</label><input id="s_tax" type="number" step="0.01" value="${+s.taxRate||0}"></div>
    </div>
    <div class="field"><label for="s_addr">Shop address</label><input id="s_addr" value="${esc(s.address)}"></div>
    <h3 style="margin-top:22px">How customers pay you</h3>
    <p class="muted" style="font-size:.86rem;margin-top:-6px">Shown at checkout. Fill in whichever of these you actually use.</p>
    <div class="field"><label for="s_zelle">Zelle — phone or email you're registered with</label><input id="s_zelle" value="${esc(s.zelleInfo)}" placeholder="you@example.com or 555-123-4567"></div>
    <div class="field"><label for="s_paypal">PayPal.me link</label><input id="s_paypal" value="${esc(s.paypalLink)}" placeholder="https://paypal.me/yourname"></div>
    <div class="field"><label for="s_apay">Apple Pay — how you accept it</label><input id="s_apay" value="${esc(s.applePayInfo)}" placeholder="Send via Messages to 555-123-4567"></div>
    <button class="btn gold" type="submit">Save settings</button>
  </form>

  <div class="panel" style="margin-top:20px"><h3>Account &amp; security</h3>
    <div class="field"><label for="s_ownerphone">Your phone (for sign-in confirmation codes)</label><input id="s_ownerphone" value="${esc(s.ownerPhone)}" placeholder="555-123-4567" onchange="S.settings.ownerPhone=this.value;save()"></div>
    <p class="muted" style="font-size:.84rem;margin:-6px 0 16px">Leave this blank to sign in with just username, password and code. Fill it in and signing in also texts yourself a confirmation code.</p>
    <p class="muted" style="font-size:.86rem">Your owner username, password and code are set in the site's code (near the top of the &lt;script&gt; block, as <code>OWNER_USERNAME</code>, <code>OWNER_PASSWORD</code> and <code>OWNER_CODE</code>) rather than here, so changing them means editing that file.</p>
  </div>
  <div class="panel" style="margin-top:20px"><h3>GitHub write access</h3>
    <p class="muted" style="font-size:.86rem;margin-top:-4px">Needed on this device to save any change — new parts, settings, anything. Reading the site works without it. See the setup note at the top of the HTML file for how to create one.</p>
    <div class="field"><label for="s_ghtoken">GitHub token</label><input id="s_ghtoken" type="password" autocomplete="off" placeholder="${ghToken()?"•••••••••••••••••••• (saved on this device)":"github_pat_..."}" onchange="const v=this.value.trim(); setGhToken(v); this.value=''; fileSha=null; toast(v?'Token saved on this device.':'Token removed from this device.');"></div>
    <p class="muted" style="font-size:.82rem">Stored only in this browser's local storage — never written to data.json, never emailed, never visible to anyone else. Leave blank and submit to remove it from this device.</p>
  </div>
  <div class="panel" style="margin-top:20px"><h3>Backup</h3>
    <p class="muted" style="font-size:.9rem">${ghConfigured?"Your catalog lives in data.json in your GitHub repo now, so devices stay in sync. Still worth exporting a copy now and then in case anything goes wrong.":"Your catalog lives in this browser only right now. Export a copy before switching devices, or email yourself a plain-text copy of everything."}</p>
    <div class="row"><button class="btn ghost" onclick="exportData()">Export JSON</button>
    <label class="btn ghost" style="margin:0">Import JSON<input type="file" accept="application/json" style="display:none" onchange="importData(this)"></label>
    <button class="btn ghost" onclick="emailEverything()">Email me everything</button></div>

function emailEverything(){
  const s = S.settings;
  const body = `APEX COMPUTERS — FULL SITE BACKUP\n${new Date().toLocaleString()}\n\n`+
    `SETTINGS\n`+Object.entries(s).filter(([k])=>k!=="ownerPasswordHash").map(([k,v])=>`${k}: ${v}`).join("\n")+
    `\n\nPRODUCTS (${S.products.length})\n`+(S.products.map(p=>`- ${p.name} — ${money(p.price)} [${p.category||"—"}]\n  ${p.desc||""}`).join("\n")||"(none)")+
    `\n\nPARTS (${S.parts.length})\n`+(S.parts.map(p=>`- ${p.name} — ${money(p.price)} [${p.category}]${p.socket?` socket ${p.socket}`:""}${p.memType?` ${p.memType}`:""}`).join("\n")||"(none)")+
    `\n\nORDERS (${S.orders.length})\n`+(S.orders.map(o=>`- ${o.ref} — ${o.name} — ${money(o.total)} — ${o.status}`).join("\n")||"(none)")+
    `\n\nTECH REQUESTS (${S.requests.length})\n`+(S.requests.map(r=>`- ${r.name} — ${r.email} — ${r.device||"—"}`).join("\n")||"(none)")+
    `\n\n(Your owner password is left out of this email on purpose.)`;
  mailOwner("Apex Computers — full site backup", body);
}
function saveSettings(e){
  e.preventDefault();
  Object.assign(S.settings,{shopName:s_shop.value,tagline:s_tag.value,ownerEmail:s_mail.value,phone:s_phone.value,
    buildFee:+s_fee.value||0,taxRate:+s_tax.value||0,address:s_addr.value,
    zelleInfo:s_zelle.value,paypalLink:s_paypal.value,applePayInfo:s_apay.value});
  save(); render(); toast("Settings saved.");
}
function inbox(){
  if(!isOwner) return staff();
  const statusLabel = {requested:"Awaiting invoice",invoiced:"Invoice sent",working:"Working on it",shipped:"Shipped",delivered:"Delivered"};
  return `<div class="wrap"><div class="pagehead"><div><h2>Orders &amp; requests</h2></div></div>
  <h3>Orders (${S.orders.length})</h3>
  ${S.orders.length?`<div class="scroll"><table><tr><th>Ref</th><th>When</th><th>Customer</th><th>Items</th><th>Total</th><th>Status</th><th></th></tr>
  ${S.orders.map(o=>`<tr><td>${esc(o.ref)}</td><td>${new Date(o.at).toLocaleDateString()}</td>
    <td>${esc(o.name)}<br><small class="muted">${esc(o.email)}<br>${esc(o.address)}</small></td>
    <td><small>${o.items.map(i=>esc(i.name)).join("<br>")}</small></td><td>${money(o.total)}</td>
    <td><small>${statusLabel[o.status]||o.status}</small></td>
    <td class="row" style="flex-wrap:wrap">
      <button class="btn sm ghost" onclick="mailOwner('Order '+${esc(JSON.stringify(o.ref))}, orderText(S.orders.find(x=>x.id===${esc(JSON.stringify(o.id))})))">Email me a copy</button>
      <button class="btn sm gold" onclick="sendInvoice(${esc(JSON.stringify(o.id))})">Send invoice</button>
      <button class="btn sm ghost" onclick="sendStatusEmail(${esc(JSON.stringify(o.id))},'working')">Working on it</button>
      <button class="btn sm ghost" onclick="sendStatusEmail(${esc(JSON.stringify(o.id))},'shipped')">Shipped</button>
      <button class="btn sm ghost" onclick="sendStatusEmail(${esc(JSON.stringify(o.id))},'delivered')">Delivered</button>
    </td></tr>`).join("")}
  </table></div>`:`<div class="empty">No orders yet.</div>`}
  <h3 style="margin-top:32px">Tech requests (${S.requests.length})</h3>
  ${S.requests.length?`<div class="scroll"><table><tr><th>When</th><th>Who</th><th>Device</th><th>Issue</th><th></th></tr>
  ${S.requests.map(r=>`<tr><td>${new Date(r.at).toLocaleDateString()}</td>
    <td>${esc(r.name)}<br><small class="muted">${esc(r.email)}<br>${esc(r.phone)}<br>${esc(r.address)}</small></td>
    <td>${esc(r.device)}</td><td><small>${esc(r.issue)}</small></td>
    <td><button class="btn sm ghost" onclick="replyToRequest(${esc(JSON.stringify(r.id))})">Reply</button></td></tr>`).join("")}
  </table></div>`:`<div class="empty">No requests yet.</div>`}
  </div>`;
}
function replyToRequest(reqId){
  const r = S.requests.find(x=>x.id===reqId); if(!r) return;
  const body = `Hi ${r.name},\n\nGot your request about: ${r.issue}\n\nLet's get you scheduled — `;
  mailCustomer(r.email, "Re: your service request", body);
}
function mailCustomer(to,subject,body){
  copyText(body);
  const url = `mailto:${encodeURIComponent(to)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
  const a = document.createElement("a"); a.href = url; a.rel="noopener"; document.body.appendChild(a); a.click(); a.remove();
  toast("Opening your email app — if nothing appears, the message is on your clipboard to paste in.");
}
function sendInvoice(orderId){
  const o = S.orders.find(x=>x.id===orderId); if(!o) return;
  o.status = "invoiced"; save();
  mailCustomer(o.email, `Invoice for order ${o.ref}`, invoiceText(o));
  render(); toast("Invoice email opened — send it to "+o.email+".");
}
const STATUS_TEXT = {
  working: {subj:"Your order is being worked on", line:"Wanted to let you know we've started work on your order."},
  shipped: {subj:"Your order has shipped", line:"Your order is on its way."},
  delivered: {subj:"Your order has been delivered", line:"Your order has been delivered. Thanks for going with us!"}
};
function sendStatusEmail(orderId, statusKey){
  const o = S.orders.find(x=>x.id===orderId); if(!o) return;
  const t = STATUS_TEXT[statusKey]; if(!t) return;
  o.status = statusKey; save();
  const body = `Hi ${o.name},\n\n${t.line}\n\nOrder ${o.ref}:\n`+o.items.map(i=>`- ${i.name}`).join("\n")+
    `\n\nQuestions? Just reply to this email.\n\n${S.settings.shopName||"Apex Computers"}`;
  mailCustomer(o.email, `${t.subj} — ${o.ref}`, body);
  render(); toast("Status updated and email opened for "+o.email+".");
}


/* ---------- owner editing dialogs ---------- */
function editProduct(id){
  if(!isOwner) return;
  const p = id ? S.products.find(x=>x.id===id) : {id:uid(),name:"",category:"",price:0,desc:"",image:""};
  const html = `<div class="dlg"><h3>${id?"Edit":"New"} product</h3>
    <div class="field"><label>Name</label><input id="p_name" value="${esc(p.name)}"></div>
    <div class="field"><label>Category</label><input id="p_cat" value="${esc(p.category)}" placeholder="Prebuilt, accessory, laptop..."></div>
    <div class="field"><label>Price ($)</label><input id="p_price" type="number" step="0.01" value="${+p.price||0}"></div>
    <div class="field"><label>Details customers see</label><textarea id="p_desc">${esc(p.desc)}</textarea></div>
    <div class="field"><label>Photo URL (optional)</label><input id="p_img" value="${esc(p.image||"")}"></div>
    <div class="row"><button class="btn gold" onclick="saveProduct('${p.id}',${!!id})">Save</button>
    <button class="btn ghost" onclick="editDlg.close()">Cancel</button></div></div>`;

function saveProduct(id,exists){
  const rec = {id,name:p_name.value.trim(),category:p_cat.value.trim(),price:+p_price.value||0,desc:p_desc.value.trim(),image:p_img.value.trim()};

  if(exists) S.products = S.products.map(x=>x.id===id?rec:x); else S.products.push(rec);

function delProduct(id){ if(confirm("Delete this product?")){ S.products=S.products.filter(x=>x.id!==id); save(); render(); } }

function editPart(id,presetCat){

  const p = id ? S.parts.find(x=>x.id===id) : {id:uid(),name:"",category:presetCat||"CPU",price:0,desc:"",socket:"",memType:"",tdp:"",watts:"",power:""};

    <div id="specBox">
      <div class="field"><label>Socket</label><select id="q_sock"><option value="">—</option>${SOCKETS.map(s=>`<option ${p.socket===s?"selected":""}>${s}</option>`).join("")}</select></div>
      <div class="field"><label>Memory type</label><select id="q_mem"><option value="">—</option><option ${p.memType==="DDR5"?"selected":""}>DDR5</option><option ${p.memType==="DDR4"?"selected":""}>DDR4</option></select></div>

function savePart(id,exists){
  const rec = {id,name:q_name.value.trim(),category:q_cat.value,price:+q_price.value||0,desc:q_desc.value.trim(),

function delPart(id){ if(confirm("Delete this part?")){ S.parts=S.parts.filter(x=>x.id!==id); Object.keys(buildSel).forEach(k=>{if(buildSel[k]===id)delete buildSel[k]}); save(); render(); } }
function toggleSpecs(){}

function editText(key,label){
  if(!isOwner) return;
  openDlg(`<div class="dlg"><h3>Edit ${esc(label)} page</h3>
    <div class="field"><textarea id="t_val" style="min-height:200px">${esc(S.settings[key]||"")}</textarea></div>
    <div class="row"><button class="btn gold" onclick="S.settings['${key}']=t_val.value;save();editDlg.close();render();toast('Page saved.')">Save</button>
    <button class="btn ghost" onclick="editDlg.close()">Cancel</button></div></div>`);
}
let editDlg = null;
function openDlg(html){
  if(editDlg) editDlg.remove();
  editDlg = document.createElement("dialog");
  editDlg.innerHTML = html;
  document.body.appendChild(editDlg);
  editDlg.showModal();
}

/* ---------- backup ---------- */
function exportData(){
  const blob = new Blob([JSON.stringify(S,null,2)],{type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "apex-computers-backup.json"; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function importData(input){
  const f = input.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => { try{ S = Object.assign(structuredClone(DEFAULTS), JSON.parse(r.result)); save(); render(); toast("Backup loaded."); }
    catch(e){ toast("That file didn't read as a backup."); } };
  r.readAsText(f);
}

/* ---------- misc ---------- */
let toastT = null;
function toast(msg){
  document.querySelectorAll(".toast").forEach(t=>t.remove());
  const d = document.createElement("div"); d.className="toast"; d.textContent=msg;
  document.body.appendChild(d); clearTimeout(toastT); toastT = setTimeout(()=>d.remove(),3200);
}
startCloudSync();
