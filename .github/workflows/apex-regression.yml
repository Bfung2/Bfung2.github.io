name: Apex storefront regression checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: apex-regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Static quality and customer-safe tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Parse module JavaScript
        run: |
          node --check customer-accounts.js
          node --check customer-experience.js
          node --check staff-workspace.js
          node --check staff-sales-ledger.js
          node --check order-tracking.js
          node --check market-sales.js
          node --check promo-codes.js
          node --check apex-policies.js
          node --check build-compatibility.js
          node --check owner-test-checkout.js
          if test -f catalog-health.js; then node --check catalog-health.js; fi
          node --check owner-operations.js
          node --check scripts/ops-monitor.mjs
      - name: Check public-data privacy and storefront references
        run: node tests/site-safety.mjs
      - name: Customer account regression
        run: node tests/customer-accounts.mjs
      - name: Phase 5 customer security regression
        run: node tests/phase5-security.mjs
      - name: Customer account Phase 6 experience regression
        run: node tests/phase6-customer.mjs
      - name: Employee sales Phase 7 reconciliation regression
        run: node tests/phase7-sales-ledger.mjs
      - name: Confirmed full-catalog evidence regression
        run: node tests/full-catalog-audit.mjs
      - name: Checkout catalog validation regression
        run: node tests/checkout-catalog-validation.mjs
      - name: Automatic profit pricing and Newegg eligibility regression
        run: node tests/catalog-profit-pricing.mjs
      - name: Owner shipping and tax settings regression
        run: node tests/settings-save.mjs
      - name: Targeted catalog pricing and SKU evidence regression
        run: node tests/catalog-targeted-verification.mjs
      - name: Catalog edit synchronization regression
        run: node tests/catalog-edit-sync.mjs
      - name: Optional newer component regressions
        run: |
          if test -f tests/catalog-health.mjs; then node tests/catalog-health.mjs; fi
          if test -f tests/staff-sales-view.mjs; then node tests/staff-sales-view.mjs; fi
      - name: Phase 8 catalog search and eligibility checks
        run: node tests/phase8-catalog-search.mjs
      - name: Phase 8 static catalog audit unit tests
        run: python3 -m unittest discover -s tests -p 'test_catalog_phase8.py'
      - name: Phase 9 Build a PC compatibility tests
        run: node tests/build-compatibility.mjs
      - name: Phase 10 mobile storefront and checkout UX regression
        run: node tests/phase10-storefront.mjs
      - name: Phase 11 owner operations and public monitor regression
        run: node tests/phase11-operations.mjs
      - name: Create non-destructive static catalog report
        run: |
          python3 scripts/audit_catalog.py --data data.json \
            --output "$RUNNER_TEMP/catalog-audit-report.json" \
            --review-queue "$RUNNER_TEMP/catalog-review-queue.csv"
      - uses: actions/upload-artifact@v4
        with:
          name: static-catalog-review-queue
          path: |
            ${{ runner.temp }}/catalog-audit-report.json
            ${{ runner.temp }}/catalog-review-queue.csv
          retention-days: 14
